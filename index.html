<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아리비앤씨 프로젝트 관리</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── 웜페이퍼 팔레트 (기본 강조색: 브라스) ── */
  --bg:#f6f4ee;--card:#fff;--primary:#8a6a34;--primary-lt:rgba(138,106,52,.12);
  --text:#211d15;--muted:#75705f;--border:#e4ddcd;--border2:#d8cfb9;
  --done:#5f7d6f;--prog:#a97f3f;--plan-c:#4f5e73;--hold:#8c5352;--today:#a97f3f;
  --done-bg:rgba(95,125,111,.13);--prog-bg:rgba(169,127,63,.15);--plan-bg:rgba(79,94,115,.12);--hold-bg:rgba(140,83,82,.13);
  --sh:0 1px 3px rgba(60,50,20,.08), 0 1px 2px rgba(60,50,20,.06);
  --hdr-grad:linear-gradient(135deg,#3d2f14,#6b4f22 55%,#8a6a34);
  --font-main:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  /* 프로젝트 메모 4분할 카드 색상 (라이트) */
  --m1-bg:#fff1e8;--m1-border:#ffd9c2;--m1-text:#c2410c;
  --m2-bg:#fefce8;--m2-border:#fde68a;--m2-text:#a16207;
  --m3-bg:#eff6ff;--m3-border:#bfdbfe;--m3-text:#1d4ed8;
  --m4-bg:#f0fdf4;--m4-border:#bbf7d0;--m4-text:#15803d;
}
/* ── 라이트 · 강조색 스와치 ── */
:root[data-accent="blue"]{--primary:#3B5BDB;--primary-lt:rgba(59,91,219,.12);--hdr-grad:linear-gradient(135deg,#111c4e,#2541b2 55%,#3B5BDB)}
:root[data-accent="sage"]{--primary:#5f7d6f;--primary-lt:rgba(95,125,111,.13);--hdr-grad:linear-gradient(135deg,#1f2e27,#3e5449 55%,#5f7d6f)}
:root[data-accent="slate"]{--primary:#4f5e73;--primary-lt:rgba(79,94,115,.13);--hdr-grad:linear-gradient(135deg,#1c222c,#33404f 55%,#4f5e73)}
:root[data-accent="wine"]{--primary:#8c5352;--primary-lt:rgba(140,83,82,.13);--hdr-grad:linear-gradient(135deg,#2e1a1a,#5c3231 55%,#8c5352)}
/* ── 다크 모드 (기본 강조색: 브라스, 간트차트의 옵시디언 톤과 통일) ── */
:root[data-theme="dark"]{
  --bg:#14120f;--card:#1c1914;--primary:#c9a45c;--primary-lt:rgba(201,164,92,.14);
  --text:#efe8db;--muted:#a89f8c;--border:#332c20;--border2:#3d3527;
  --done:#7fa393;--prog:#c9a45c;--plan-c:#7c8ca3;--hold:#b16f6e;--today:#c9a45c;
  --done-bg:rgba(127,163,147,.16);--prog-bg:rgba(201,164,92,.16);--plan-bg:rgba(124,140,163,.15);--hold-bg:rgba(177,111,110,.16);
  --sh:0 1px 3px rgba(0,0,0,.4);
  --hdr-grad:linear-gradient(135deg,#14120f,#241d12 55%,#c9a45c);
  color-scheme:dark;
  /* 프로젝트 메모 4분할 카드 색상 (다크) */
  --m1-bg:rgba(224,147,95,.14);--m1-border:rgba(224,147,95,.32);--m1-text:#e0935f;
  --m2-bg:rgba(217,176,84,.14);--m2-border:rgba(217,176,84,.32);--m2-text:#d9b054;
  --m3-bg:rgba(138,165,240,.14);--m3-border:rgba(138,165,240,.32);--m3-text:#8aa5f0;
  --m4-bg:rgba(127,191,143,.14);--m4-border:rgba(127,191,143,.32);--m4-text:#7fbf8f;
}
:root[data-theme="dark"][data-accent="blue"]{--primary:#6d8fe0;--primary-lt:rgba(109,143,224,.16);--hdr-grad:linear-gradient(135deg,#0d1220,#16233f 55%,#3f5faa)}
:root[data-theme="dark"][data-accent="sage"]{--primary:#7fa393;--primary-lt:rgba(127,163,147,.16);--hdr-grad:linear-gradient(135deg,#10130f,#1e2a22 55%,#7fa393)}
:root[data-theme="dark"][data-accent="slate"]{--primary:#7c8ca3;--primary-lt:rgba(124,140,163,.16);--hdr-grad:linear-gradient(135deg,#0f1216,#1c242e 55%,#7c8ca3)}
:root[data-theme="dark"][data-accent="wine"]{--primary:#b16f6e;--primary-lt:rgba(177,111,110,.16);--hdr-grad:linear-gradient(135deg,#160f0f,#2c1c1b 55%,#b16f6e)}
body{font-family:var(--font-main);background:var(--bg);color:var(--text);transition:background .15s,color .15s}
.card,.pc,.dh,.memo-box,.sc,.cat-block,.ttable th,.story-feed,.gw{transition:background .15s,color .15s,border-color .15s}
.hdr h1,.dh h2,.en-head h3,.story-date-hdr{font-family:var(--font-main)}

/* THEME/ACCENT PICKER */
.theme-picker{display:flex;align-items:center;gap:8px}
.tp-swatches{display:flex;gap:5px;align-items:center;padding:3px 6px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);border-radius:20px}
.tp-sw{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);cursor:pointer;padding:0}
.tp-sw.active{box-shadow:0 0 0 2px #fff}
.tp-sw.tp-blue{background:linear-gradient(135deg,#2541b2,#3B5BDB)}
.tp-sw.tp-brass{background:linear-gradient(135deg,#6b4f22,#c9a45c)}
.tp-sw.tp-sage{background:linear-gradient(135deg,#3e5449,#7fa393)}
.tp-sw.tp-slate{background:linear-gradient(135deg,#33404f,#7c8ca3)}
.tp-sw.tp-wine{background:linear-gradient(135deg,#5c3231,#b16f6e)}
.tp-seg{display:flex;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);border-radius:20px;padding:2px}
.tp-seg button{border:none;background:transparent;color:rgba(255,255,255,.75);font-size:11px;font-weight:700;padding:4px 10px;border-radius:16px;cursor:pointer}
.tp-seg button.on{background:rgba(255,255,255,.22);color:#fff}

/* HEADER */
.hdr{background:var(--hdr-grad);color:#fff;padding:16px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(30,58,138,.25);position:sticky;top:0;z-index:30}
.hdr h1{font-size:18px;font-weight:800}
.hdr p{font-size:11.5px;opacity:.75;margin-top:2px}
.hdr-btn{padding:6px 13px;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;font-weight:700}
.hdr-btn:hover{background:rgba(255,255,255,.2)}
.nav-pl-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:12.5px;cursor:pointer;font-weight:700;box-shadow:var(--sh)}
.nav-pl-btn:hover{background:var(--primary-lt)}
.nav-pl-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.hdr-stats{margin-left:auto;display:flex;gap:18px}
.hs .n{font-size:21px;font-weight:800;text-align:center}
.hs .l{font-size:10px;opacity:.75;text-align:center}
.status-line{font-size:11px;opacity:.85}
.status-line.err{color:#fecaca;font-weight:700}

/* NAV */
.nav{background:var(--card);border-bottom:1px solid var(--border);padding:9px 28px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.nav input{flex:1;min-width:180px;padding:7px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none}
.nav input:focus{border-color:var(--primary)}
.fb{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s;white-space:nowrap}
.fb.on{background:var(--primary-lt);border-color:var(--primary);color:var(--primary);font-weight:700}

/* LAYOUT */
.main{display:flex;min-height:calc(100vh - 128px)}

/* PROJECT LIST */
.plist{width:300px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 128px)}
.pc{padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.pc:hover{background:var(--primary-lt)}
.pc.on{background:var(--primary-lt);border-left:3px solid var(--primary)}
.pc.hold-proj{border-left:3px solid var(--hold)}
.pid{font-size:11px;color:var(--muted);font-family:monospace}
.pname{font-size:14px;font-weight:700;margin:2px 0 3px}
.pfunc{font-size:12.5px;color:var(--primary);margin-bottom:4px}
.pmeta{font-size:12px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}
.tbadge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10.5px;font-weight:700;background:var(--primary-lt);color:var(--primary);margin-bottom:3px}
.pbar{margin-top:6px;height:3px;background:var(--border);border-radius:2px}
.pfill{height:100%;background:var(--done);border-radius:2px;transition:width .3s}
.no-res{padding:32px;text-align:center;color:var(--muted);font-size:13px}

/* DETAIL */
.dp{flex:1;overflow-y:auto;overflow-anchor:none;max-height:calc(100vh - 128px);padding:22px 26px}
.dp.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted)}
.dp.empty .ei{font-size:52px;margin-bottom:10px;opacity:.3}

.dp-sticky{position:sticky;top:0;z-index:12;background:var(--bg);margin-bottom:8px;isolation:isolate;will-change:transform}
.dp-stick-bar{display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:10px;padding:8px 16px;box-shadow:var(--sh);cursor:pointer;user-select:none}
.dp-stick-bar:hover{background:var(--primary-lt)}
.dp-stick-bar.show{display:flex}
.dp-stick-name{font-size:14px;font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-stick-id{font-size:11.5px;color:var(--muted);font-weight:700;font-family:monospace;margin-left:6px}
.dp-stick-toggle{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;display:flex;align-items:center;gap:4px;flex-shrink:0}
.dp-collapsible{overflow:hidden;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s ease,margin-bottom .28s ease;opacity:1}
.dp-collapsible.dp-fading{opacity:0}
.dh{background:var(--card);border-radius:11px;padding:9px 20px 7px;box-shadow:var(--sh);margin-bottom:6px}
.dh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.dh h2{font-size:16.5px;font-weight:800;margin-bottom:1px}
.ftag{display:inline-block;background:var(--primary);color:#fff;padding:1px 8px;border-radius:6px;font-size:11px;margin-bottom:0}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;margin-top:5px}
.mi{min-width:0}
.mi label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:0}
.mi span{font-size:12.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi.wide{grid-column:1/-1}
.mi.wide span{white-space:pre-wrap}

.memo-box{background:var(--card);border-radius:10px;padding:8px 16px;box-shadow:var(--sh);margin-bottom:8px}
.memo-box h4{font-size:12.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.memo-box h4 a{font-size:11px;font-weight:700;color:var(--primary);text-decoration:none;background:var(--primary-lt);padding:2px 8px;border-radius:20px;margin-left:auto}
.memo-box h4 a:hover{background:var(--primary);color:#fff}
.memo-current{background:var(--primary-lt);border:1px solid var(--border);border-radius:7px;padding:6px 10px;margin-bottom:4px}
.memo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
@media(max-width:720px){.memo-grid{grid-template-columns:1fr}}
.memo-sec{border-radius:8px;padding:8px 10px;border:1px solid transparent}
.memo-sec-t{font-size:12px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.memo-sec-b{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.memo-sec-b:empty::after{content:'-';color:var(--muted)}
.memo-sec.m1{background:var(--m1-bg);border-color:var(--m1-border)}
.memo-sec.m1 .memo-sec-t{color:var(--m1-text)}
.memo-sec.m2{background:var(--m2-bg);border-color:var(--m2-border)}
.memo-sec.m2 .memo-sec-t{color:var(--m2-text)}
.memo-sec.m3{background:var(--m3-bg);border-color:var(--m3-border)}
.memo-sec.m3 .memo-sec-t{color:var(--m3-text)}
.memo-sec.m4{background:var(--m4-bg);border-color:var(--m4-border)}
.memo-sec.m4 .memo-sec-t{color:var(--m4-text)}
.memo-hist-toggle{font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;padding:2px 0}
.memo-hist-toggle:hover{color:var(--primary)}
.memo-list{max-height:220px;overflow-y:auto;margin-top:4px}
.memo-item{padding:7px 0;border-bottom:1px solid var(--border)}
.memo-item:last-child{border-bottom:none}
.memo-date{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.memo-user{color:var(--text);font-weight:700}
.memo-text{font-size:13.5px;color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.memo-empty{padding:8px 0;text-align:center;color:var(--muted);font-size:12px;line-height:1.5}

.vtabs{display:flex;gap:0;background:var(--primary-lt);border-radius:10px;padding:3px;margin-bottom:8px}
.vtab{flex:1;padding:6px 0;text-align:center;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted);border:none;background:none;transition:all .2s}
.vtab.on{background:var(--card);color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1)}

.ss{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc{flex:1;min-width:78px;background:var(--card);border-radius:9px;padding:7px;box-shadow:var(--sh);text-align:center}
.sc .n{font-size:16.5px;font-weight:800}
.sc .l{font-size:10px;color:var(--muted);margin-top:0}

/* CATEGORY / TASK TABLE — 프로토타입 톤(절제된 소프트 배지 + 대문자 섹션 라벨) */
.cat-block{background:var(--card);border-radius:12px;box-shadow:var(--sh);border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
.cat-hdr{display:flex;align-items:center;padding:12px 16px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);transition:background .12s;gap:9px}
.cat-hdr:hover{background:var(--primary-lt)}
.cat-arrow{font-size:10px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.cat-arrow.open{transform:rotate(90deg)}
.cat-title{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);flex:1}
.cat-cnt{font-size:11.5px;background:var(--primary-lt);color:var(--primary);font-weight:700;padding:2px 9px;border-radius:10px}
.cat-done-badge{font-size:11.5px;padding:3px 10px;border-radius:10px;flex-shrink:0}
.cat-body{display:none}
.cat-body.open{display:block}
.ttable-wrap{overflow-x:auto}
.ttable{width:100%;min-width:820px;border-collapse:collapse;font-size:13px;table-layout:fixed}
.ttable col.c-name{width:28%}
.ttable col.c-status{width:9%}
.ttable col.c-period{width:19%}
.ttable col.c-asg{width:10%}
.ttable col.c-memo{width:8%}
.ttable td, .ttable th{overflow:hidden;text-overflow:ellipsis}
.ttable td:nth-child(1){white-space:normal;word-break:break-word}
.ttable th{background:var(--card);padding:9px 12px;text-align:left;font-weight:700;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border2);white-space:nowrap}
.ttable td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.ttable tr:last-child td{border-bottom:none}
.ttable tr:hover td{background:var(--primary-lt)}
.ttable tr.row-hold td{background:var(--hold-bg)!important}
.tl-name{font-weight:600}
.spill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:700;white-space:nowrap}
.spill::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
.spill.s-done{background:var(--done-bg);color:var(--done)}
.spill.s-done::before{background:var(--done)}
.spill.s-prog{background:var(--prog-bg);color:var(--prog)}
.spill.s-prog::before{background:var(--prog)}
.spill.s-plan{background:var(--plan-bg);color:var(--plan-c)}
.spill.s-plan::before{background:var(--plan-c)}
.spill.s-hold{background:var(--hold-bg);color:var(--hold)}
.spill.s-hold::before{background:var(--hold)}
.memo-dot{color:var(--prog);font-size:11px}
.asg-chip{display:inline-flex;align-items:center;gap:6px}
.asg-avatar{width:20px;height:20px;border-radius:50%;background:var(--primary-lt);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;border:1px solid var(--border)}

/* GANTT (v6 style) */
/* gw 자체는 overflow:hidden을 쓰지 않는다 — position:sticky는 "visible이 아닌 overflow를 가진
   조상"을 기준으로 고정되는데, gw에 overflow:hidden이 있으면 그 안의 ghdr/gleg/월헤더가 #dp가
   아니라 gw를 기준으로 고정을 시도하게 되어(그리고 gw는 실제로 스크롤되는 요소가 아니라서) 고정이
   전혀 동작하지 않는 문제가 있었음. 대신 둥근 모서리는 맨 위(ghdr)에만 직접 지정한다. */
.gw{background:var(--card);border-radius:12px;box-shadow:var(--sh)}
.ghdr{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:11;background:var(--card);isolation:isolate;border-radius:12px 12px 0 0}
.ghdr h3{font-size:14.5px;font-weight:700}
.gctrl{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gzbtn,.gtdbtn{padding:4px 11px;border-radius:6px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--muted);font-weight:600;transition:all .15s}
.gzbtn.on{background:var(--primary-lt);border-color:var(--primary);color:var(--primary)}
.gzbtn:hover,.gtdbtn:hover{border-color:var(--primary);color:var(--primary)}
.gleg{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:10;background:var(--card);isolation:isolate}
.gli{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text);font-weight:600;background:var(--primary-lt);border:1px solid var(--border);padding:3px 10px 3px 8px;border-radius:20px}
.gld{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(0,0,0,.03)}
.ginner{display:flex;border-top:none}
.glabels{flex-shrink:0;width:220px;border-right:2px solid var(--border);background:var(--card)}
.glhdr{height:32px;background-color:var(--card);background-image:linear-gradient(var(--primary-lt),var(--primary-lt));border-bottom:2px solid var(--border);display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:var(--muted);position:sticky;top:0;z-index:9;isolation:isolate}
.glrow{height:48px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 8px 0 10px;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--border);overflow:hidden}
.glrow .gllabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glrow .glsub{font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glrow.glcat{font-weight:700;color:var(--muted);background:var(--bg);font-size:11.5px;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.glrow.glcat .gllabel{text-transform:uppercase}
.glrow.glcat .glsub{color:var(--muted);opacity:.8}

/* ── Obsidian · Brass skin ── */
.gw.gw-obsidian{--go-bg:#14120f;--go-surface:#1c1914;--go-surface2:#211d17;--go-ink:#efe8db;--go-muted:#9a9382;--go-accent:#c9a45c;--go-accent-soft:#8f7a4a;--go-line:#332e25;--go-line2:#443d2f;background:var(--go-bg);box-shadow:0 24px 50px -24px rgba(0,0,0,.55)}
.gw.gw-obsidian .ghdr{border-bottom-color:var(--go-line)}
.gw.gw-obsidian .ghdr h3{color:var(--go-ink);font-family:var(--font-main);font-weight:700;letter-spacing:.01em}
.gw.gw-obsidian .gzbtn,.gw.gw-obsidian .gtdbtn,.gw.gw-obsidian .gwkbtn{background:var(--go-surface);border-color:var(--go-line2);color:var(--go-muted)}
.gw.gw-obsidian .gzbtn.on,.gw.gw-obsidian .gwkbtn.on{background:rgba(201,164,92,.14);border-color:var(--go-accent);color:var(--go-accent)}
.gw.gw-obsidian .gzbtn:hover,.gw.gw-obsidian .gtdbtn:hover,.gw.gw-obsidian .gwkbtn:hover{border-color:var(--go-accent);color:var(--go-accent)}
.gw.gw-obsidian .gleg{border-bottom-color:var(--go-line)}
.gw.gw-obsidian .gli{background:var(--go-surface);border-color:var(--go-line2);color:var(--go-ink)}
.gw.gw-obsidian .glabels{background:var(--go-surface);border-right-color:var(--go-line)}
.gw.gw-obsidian .glhdr{background:var(--go-surface2);border-bottom-color:var(--go-line);color:var(--go-muted);font-family:var(--font-main);letter-spacing:.06em;text-transform:uppercase;font-size:9.5px}
.gw.gw-obsidian .gyspacer{background:var(--go-surface2);border-bottom-color:var(--go-line)}
.gw.gw-obsidian .glrow{border-bottom-color:var(--go-line);color:var(--go-ink)}
.gw.gw-obsidian .glrow.glcat{background:var(--go-surface2);color:var(--go-muted)}
.gw.gw-obsidian .glrow.glcat .glsub{color:var(--go-muted);opacity:.85}
.gw.gw-obsidian .gcanvas{background:var(--go-bg)}
.gw.gw-obsidian .gchdrs,.gw.gw-obsidian .gyhdrs{background:var(--go-surface2);border-bottom-color:var(--go-line)}
.gw.gw-obsidian .gyhdr{color:var(--go-accent);border-right-color:var(--go-line)}
.gw.gw-obsidian .gchdr{color:var(--go-muted);border-right-color:var(--go-line)}
.gw.gw-obsidian .gchdr.gms{border-left-color:var(--go-line2);color:var(--go-ink)}
.gw.gw-obsidian .gchdr.gtd{background:rgba(201,164,92,.16);color:var(--go-accent)}
.gw.gw-obsidian .gchdr.gwknd{background:#181511;color:#5c5748}
.gw.gw-obsidian .grow{border-bottom-color:var(--go-line)}
.gw.gw-obsidian .grow:hover{background:rgba(201,164,92,.045)}
.gw.gw-obsidian .grow.grcat{background:var(--go-surface2)}
.gw.gw-obsidian .grow.grcat:hover{background:var(--go-surface2)}
.gw.gw-obsidian .gcell{border-right-color:var(--go-line)}
.gw.gw-obsidian .gcell.gtd{background:rgba(201,164,92,.09);border-right-color:var(--go-accent-soft)}
.gw.gw-obsidian .gcell.gwknd{background:#181511}
.gw.gw-obsidian .gtvline{background:repeating-linear-gradient(180deg,var(--go-accent) 0,var(--go-accent) 5px,transparent 5px,transparent 9px)}
.gw.gw-obsidian .gtflag{background:var(--go-accent);color:var(--go-bg);box-shadow:0 2px 8px rgba(201,164,92,.35)}
.gw.gw-obsidian .gdatelbl{color:var(--go-muted)}
.gw.gw-obsidian .gbarlbl{color:rgba(240,235,222,.95);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.gw.gw-obsidian .gbar-actual{box-shadow:0 1px 3px rgba(0,0,0,.4)}
.gw.gw-obsidian .gmilestone{background:var(--go-accent);box-shadow:0 0 0 3px rgba(201,164,92,.22),0 2px 6px rgba(0,0,0,.4)}
.gcanvas-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.gcanvas-headwrap{overflow:hidden;position:sticky;z-index:9;isolation:isolate}
.gcanvas{flex:1;overflow-x:auto;position:relative}
.gcinner{position:relative}
.gchdrs{display:flex;height:32px;background-color:var(--card);background-image:linear-gradient(var(--primary-lt),var(--primary-lt));border-bottom:2px solid var(--border)}
.gyspacer{height:20px;background-color:var(--card);background-image:linear-gradient(var(--primary-lt),var(--primary-lt));border-bottom:1px solid var(--border);position:sticky;top:0;z-index:9;isolation:isolate}
.gyhdrs{height:20px;position:relative;background-color:var(--card);background-image:linear-gradient(var(--primary-lt),var(--primary-lt));border-bottom:1px solid var(--border)}
.gyhdr{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--primary);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden}
.gchdr{flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden}
.gchdr.gms{border-left:2px solid #d1d5db;font-weight:700;color:var(--text)}
.gchdr.gtd{background:var(--primary-lt);color:var(--primary);font-weight:700}
.grow{height:48px;position:relative;border-bottom:1px solid var(--border);display:flex;transition:background .12s}
.grow:hover{background:var(--primary-lt)}
.grow.grcat{background:var(--bg);border-bottom:1px solid var(--border)}
.grow.grcat:hover{background:var(--bg)}
.gcell{flex-shrink:0;height:100%;border-right:1px solid #f5f5f5}
.gcell.gtd{background:var(--primary-lt);border-right:2px solid var(--primary)}
.gchdr.gwknd{background:var(--bg);color:var(--muted)}
.gcell.gwknd{background:var(--bg)}
.gwkbtn{padding:4px 11px;border-radius:6px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--muted);font-weight:600;transition:all .15s}
.gwkbtn.on{background:var(--primary-lt);border-color:var(--primary);color:var(--primary)}
.gwkbtn:hover{border-color:var(--primary);color:var(--primary)}
.gbar{position:absolute;top:50%;transform:translateY(-50%);border-radius:5px;display:flex;align-items:center;overflow:hidden;cursor:pointer;z-index:2;min-width:4px;box-shadow:0 1px 3px rgba(30,41,59,.18)}
.gbar.gbcat{height:24px;border-radius:6px}
.gbar.gbtask{height:19px}
.gbarlbl{font-size:12px;font-weight:700;color:rgba(255,255,255,.97);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.gtvline{position:absolute;top:0;bottom:0;width:2px;background:repeating-linear-gradient(180deg,var(--primary) 0,var(--primary) 5px,transparent 5px,transparent 9px);z-index:3;pointer-events:none}
.gtflag{position:absolute;top:0;background:var(--primary);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:0 0 6px 6px;z-index:4;white-space:nowrap;box-shadow:0 2px 5px rgba(169,127,63,.4);letter-spacing:.3px}
.gtip{position:fixed;background:#1e293b;color:#fff;border-radius:9px;padding:10px 14px;font-size:13px;z-index:9999;pointer-events:none;display:none;line-height:1.7;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:280px}
.gtip strong{display:block;margin-bottom:2px}
.gbar-plan{position:absolute;border-radius:3px;z-index:1;pointer-events:none}
.gbar-actual{position:absolute;border-radius:3px;cursor:pointer;z-index:2;display:flex;align-items:center;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.18)}
.gbar-wip-ext{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0px,transparent 7px,rgba(255,255,255,.22) 7px,rgba(255,255,255,.22) 9px);border-radius:0 3px 3px 0;pointer-events:none;z-index:1}
.gdatelbl{position:absolute;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;pointer-events:none;z-index:2;letter-spacing:.1px}
.gissue{position:absolute;top:1px;font-size:13px;line-height:1;transform:translateX(-50%);z-index:6;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));transition:transform .12s}
.gissue:hover{transform:translateX(-50%) scale(1.25)}
.gmilestone{position:absolute;top:50%;width:13px;height:13px;background:var(--primary);border:2px solid #fff;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:5;cursor:pointer}
.gmilestone:hover{filter:brightness(1.12)}
.gissue-cnt{position:absolute;top:-6px;right:-8px;background:#1e293b;color:#fff;font-size:8px;font-weight:800;min-width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;padding:0 2px}
.gmemo-flag{position:absolute;font-size:13px;line-height:1;z-index:6;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));transition:transform .12s}
.gmemo-flag:hover{transform:scale(1.25)}

/* STORY — 타임라인 레일 스타일 (프로토타입과 동일한 톤) */
.story-feed{background:var(--card);border-radius:12px;box-shadow:var(--sh);border:1px solid var(--border);padding:6px 18px}
.story-date-hdr{padding:12px 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.story-date-hdr:not(:first-child){border-top:1px solid var(--border);margin-top:4px}
.story-date-hdr .cnt{background:var(--primary-lt);color:var(--primary);padding:1px 8px;border-radius:10px;font-size:10.5px;font-weight:700;text-transform:none;letter-spacing:0}
.story-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.story-item:last-child{border-bottom:none}
.story-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:14px}
.story-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;box-shadow:0 0 0 3px var(--primary-lt)}
.story-line{flex:1;width:1px;background:var(--border2);margin-top:4px}
.story-content{flex:1;min-width:0}
.story-top{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.story-avatar{width:21px;height:21px;border-radius:50%;background:var(--primary-lt);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;border:1px solid var(--border)}
.story-user{font-size:13.5px;font-weight:700;color:var(--text)}
.story-time{font-size:12px;color:var(--muted)}
.story-proj{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:10px;margin-left:auto}
.story-msg{font-size:13.5px;color:var(--text);line-height:1.6}
.story-field{color:var(--muted);font-weight:600}
.story-old{color:var(--hold);text-decoration:line-through;text-decoration-color:var(--hold-bg);padding:0 2px}
.story-new{color:var(--done);font-weight:700;padding:0 2px}
.story-arrow{color:var(--muted);margin:0 1px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;background:var(--card);border-radius:14px}

/* ENROLL (임상대상자 모집현황) — 목업 데이터 */
.en-note{background:var(--primary-lt);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.en-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.en-head h3{font-size:15px;font-weight:800;color:var(--text)}
.en-head p{font-size:12px;color:var(--muted);margin-top:2px}
.en-daybox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 16px;text-align:right;box-shadow:var(--sh)}
.en-daybox b{font-size:22px;font-weight:800;color:var(--primary)}
.en-daybox div{font-size:11.5px;color:var(--muted)}
.en-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.en-sc{background:var(--card);border-radius:10px;padding:10px 12px;box-shadow:var(--sh);border:1px solid var(--border)}
.en-sc .ei2{font-size:15px;margin-bottom:2px}
.en-sc .el{font-size:11.5px;color:var(--muted);font-weight:700}
.en-sc .en{font-size:20px;font-weight:800;color:var(--text);margin:2px 0}
.en-sc .es{font-size:11px;color:var(--muted)}
.en-row{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-bottom:12px}
.en-card{background:var(--card);border-radius:12px;box-shadow:var(--sh);border:1px solid var(--border);padding:14px 16px}
.en-card h4{font-size:13.5px;font-weight:800;color:var(--text);margin-bottom:2px}
.en-card .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
/* 클릭하면 크게 볼 수 있는 카드(차트·메모) 공통 표시 */
.zoomable{cursor:zoom-in;transition:box-shadow .15s ease,border-color .15s ease}
.zoomable:hover{box-shadow:0 0 0 2px var(--primary-lt),var(--sh);border-color:var(--primary)}
.zoom-modal{display:none;position:fixed;inset:0;background:rgba(15,18,24,.6);z-index:9999;align-items:center;justify-content:center;padding:32px}
.zoom-modal.show{display:flex}
.zoom-modal-inner{background:var(--card);border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.4);max-width:min(1320px,97vw);max-height:94vh;overflow:auto;padding:36px 40px;position:relative}
.zoom-modal-close{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;border:none;background:var(--primary-lt);color:var(--text);font-size:18px;cursor:pointer;line-height:1;z-index:1}
.zoom-modal-close:hover{background:var(--border)}
.zoom-modal-body h4{font-size:21px;margin-bottom:6px}
.zoom-modal-body .sub{font-size:15px;margin-bottom:22px}
.zoom-modal-body .en-linewrap{position:relative;width:100%;height:0;padding-bottom:41.3%;overflow:hidden}
.zoom-modal-body .en-linewrap svg{position:absolute;top:0;left:0;width:100%;height:100%}
.zoom-modal-body .en-legend{font-size:15px;gap:24px;margin-top:12px}
.zoom-modal-body .en-legend i{width:18px;height:4.5px}
.zoom-modal-body .en-fun-label{font-size:14px}
.zoom-modal-body .en-fun-track{height:30px}
.zoom-modal-body .en-fun-fill{font-size:14px}
.zoom-modal-body .en-fun-drop{font-size:13px;margin-top:6px}
.zoom-modal-body .en-donuts{gap:48px;margin-top:20px}
.zoom-modal-body .en-donut-item svg{width:120px;height:120px}
.zoom-modal-body .en-dv{font-size:22px}
.zoom-modal-body .en-dl{font-size:13px}
.zoom-modal-body .memo-grid{grid-template-columns:repeat(2,1fr);gap:20px}
.zoom-modal-body .memo-sec{padding:18px 20px}
.zoom-modal-body .memo-sec-t{font-size:16px}
.zoom-modal-body .memo-sec-b{font-size:17px;line-height:1.75}
@media(max-width:640px){.zoom-modal-body .memo-grid{grid-template-columns:1fr}}
.en-fun-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.en-fun-label{width:64px;font-size:12px;color:var(--muted);font-weight:700;flex-shrink:0}
.en-fun-track{flex:1;height:20px;background:var(--primary-lt);border-radius:10px;overflow:hidden;position:relative}
.en-fun-fill{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:11px;font-weight:800;transition:width .4s}
.en-fun-drop{font-size:11.5px;color:var(--muted);margin-top:2px}
.en-donuts{display:flex;gap:24px;margin-top:16px;justify-content:center}
.en-donut-item{text-align:center}
.en-donut-item svg{width:56px;height:56px}
.en-dv{font-size:15px;font-weight:800;margin-top:3px}
.en-dl{font-size:11px;color:var(--muted)}
.en-linewrap{position:relative}
.en-linewrap svg{width:100%;height:220px}
.en-legend{display:flex;gap:14px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.en-legend i{display:inline-block;width:10px;height:2.5px;border-radius:2px;margin-right:4px;vertical-align:middle}
.en-sites{background:var(--card);border-radius:12px;box-shadow:var(--sh);border:1px solid var(--border);padding:14px 16px}
.en-site-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border)}
.en-site-row:last-child{border-bottom:none}
.en-site-name{width:120px;font-size:12.5px;color:var(--text);flex-shrink:0}
.en-site-bar{flex:1;height:9px;background:var(--primary-lt);border-radius:5px;overflow:hidden}
.en-site-bar i{display:block;height:100%;border-radius:5px}
.en-site-n{width:60px;text-align:right;font-size:12px;color:var(--text);font-weight:700}
.en-empty{background:var(--card);border-radius:12px;box-shadow:var(--sh);border:1px solid var(--border);padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}
@media (max-width: 900px){
  .en-stats{grid-template-columns:repeat(2,1fr)}
  .en-row{grid-template-columns:1fr}
}

/* ── 영업파이프라인 (전사 공통 화면, 프로젝트 비종속) ── */
.pl-wrap{padding:16px 24px 40px;display:flex;gap:20px;align-items:flex-start}
.pl-main{flex:1;min-width:0}
.pl-note{background:var(--primary-lt);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.pl-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pl-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--sh)}
.pl-chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pl-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.pl-sum-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--sh)}
.pl-sum-card .n{font-size:20px;font-weight:800}
.pl-sum-card .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;display:flex;align-items:center;gap:5px}
.pl-sum-card .l i{display:inline-block;width:8px;height:8px;border-radius:50%}
.pl-board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.pl-col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:var(--sh);min-height:100px}
.pl-col-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding-bottom:7px;border-bottom:2px solid var(--stagecolor)}
.pl-col-head i{width:8px;height:8px;border-radius:50%;background:var(--stagecolor)}
.pl-col-head b{font-size:13px;font-weight:800}
.pl-col-head span{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;background:var(--primary-lt);padding:1px 7px;border-radius:10px}
.pl-card{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:transform .1s}
.pl-card:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.pl-card:last-child{margin-bottom:0}
.pl-card-edit{position:absolute;top:7px;right:8px;font-size:12px;text-decoration:none;opacity:.55;line-height:1;padding:2px;border-radius:6px}
.pl-card-edit:hover{opacity:1;background:var(--primary-lt)}
.pl-card .pl-tag{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:8px;margin-bottom:5px}
.pl-card .pl-tag.lead{background:var(--prog-bg);color:var(--prog)}
.pl-card .pl-tag.mat{background:var(--plan-bg);color:var(--plan-c)}
.pl-card h4{font-size:12.5px;font-weight:800;color:var(--text);margin-bottom:2px;line-height:1.3}
.pl-card .pl-partner{font-size:11px;color:var(--muted);margin-bottom:5px}
.pl-card .pl-updrow{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}
.pl-card .pl-dbadge{font-weight:800;padding:1px 6px;border-radius:8px;background:var(--hold-bg);color:var(--hold)}
.pl-card .pl-dbadge.ok{background:var(--done-bg);color:var(--done)}
.pl-card .pl-lastlog{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border2);font-size:10.5px;color:var(--text);line-height:1.5;opacity:.85}
.pl-empty-col{color:var(--muted);font-size:11.5px;text-align:center;padding:14px 4px}

<script>
// 실제 라이브 배포 URL (2026.8.27 버전 3 — 연구영업 리드 파이프라인 시트 연동 포함)
const GANTT_API_URL = 'https://script.google.com/macros/s/AKfycbztyPjoPThGHol6ofbfl81eoCOKlE7UxjzwWV-tuFH67hSKYOHzkuOhqD2EH62WC8jS/exec';
// 이전(실제로는 배포되지 않았던) URL — 참고용으로만 남겨둠
// const GANTT_API_URL_OLD = 'https://script.google.com/macros/s/AKfycbySVcEpCzpRrvQzHb-Q3XjmmVb-pdjz6AgHCCn-MWl7f4gdbMYHknEAwczxMkDTRsxKaQ/exec';
const APPSHEET_URL = 'https://www.appsheet.com/start/ae92652b-e796-480b-8cfa-bbb20f0e9115';
/* AppSheet에서 Tasks 테이블 행 하나를 바로 여는 딥링크용 View 이름.
   AppSheet 편집기 → UX → Views 에서 Tasks 테이블의 Detail(또는 Form) view 이름을 확인해서
   다르면 아래 값만 바꿔주면 됨 (기본값: 자동 생성되는 이름 그대로 사용) */
const TASKS_DETAIL_VIEW = 'tasks_Detail';
function appsheetTaskUrl(taskId){
  return `${APPSHEET_URL}#view=${encodeURIComponent(TASKS_DETAIL_VIEW)}&row=${encodeURIComponent(taskId)}`;
}
/* AppSheet에서 Projects 테이블의 특정 프로젝트 행을 바로 여는 딥링크 (프로젝트 메모의 "AppSheet에서 수정" 버튼용) */
const PROJECTS_DETAIL_VIEW = 'Projects_Detail';
function appsheetProjectUrl(pid){
  return `${APPSHEET_URL}#view=${encodeURIComponent(PROJECTS_DETAIL_VIEW)}&row=${encodeURIComponent(pid)}`;
}
/* AppSheet에서 "영업리드_마스터" 테이블의 특정 리드 행을 바로 여는 딥링크 (연구영업 파이프라인 카드의 "AppSheet에서 수정" 버튼용) */
const LEAD_DETAIL_VIEW = '영업리드_마스터_Detail';
function appsheetLeadUrl(id){
  return `${APPSHEET_URL}#view=${encodeURIComponent(LEAD_DETAIL_VIEW)}&row=${encodeURIComponent(id)}`;
}
function openTaskInAppSheet(taskId, e){
  if(e) e.stopPropagation();
  if(!taskId) return;
  const url = appsheetTaskUrl(taskId);
  /* 항상 새 탭으로만 연다 — 현재 탭(대시보드)은 그대로 유지 */
  window.open(url, '_blank', 'noopener');
}

/* ── THEME/ACCENT PICKER ──
   accent names are canonical ('blue'|'brass'|'sage'|'slate'|'wine').
   기본(무표시) 강조색은 라이트·다크 모두 브라스로 통일 — 간트차트 옵시디언 톤과도 맞춘다. */
const ACCENTS = ['brass','blue','sage','slate','wine'];
let curTheme='light', curAccent='brass';
let ganttSkin = 'light'; /* 앱 라이트/다크 테마에 맞춰 'light' ↔ 'obsidian'으로 자동 전환됨 */
let curView = 'task'; /* applyTheme()이 initTheme() IIFE에서 즉시 호출되므로, curView는 그보다 먼저 선언되어야 함 (TDZ 방지) */
let selId = null; /* applyTheme() 내부에서 참조되므로 마찬가지로 미리 선언 */
(function initTheme(){
  let theme='light', accent='brass';
  try{
    theme = localStorage.getItem('ganttTheme') || 'light';
    accent = localStorage.getItem('ganttAccent') || 'brass';
  }catch(e){}
  applyTheme(theme, accent);
  document.getElementById('tp-seg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    applyTheme(b.dataset.theme, curAccent);
  });
  document.getElementById('tp-swatches').addEventListener('click', e=>{
    const b = e.target.closest('.tp-sw'); if(!b) return;
    applyTheme(curTheme, b.dataset.accentName);
  });
})();
function applyTheme(theme, accent){
  curTheme = theme; curAccent = accent;
  const root = document.documentElement;
  if(theme==='dark') root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
  if(accent && accent!=='brass') root.setAttribute('data-accent', accent); else root.removeAttribute('data-accent');
  document.querySelectorAll('#tp-seg button').forEach(b=>b.classList.toggle('on', b.dataset.theme===theme));
  document.querySelectorAll('.tp-sw').forEach(b=>b.classList.toggle('active', b.dataset.accentName===accent));
  try{ localStorage.setItem('ganttTheme', theme); localStorage.setItem('ganttAccent', accent); }catch(e){}
  /* 간트차트도 앱 라이트/다크 테마를 그대로 따라간다 */
  const newSkin = theme==='dark' ? 'obsidian' : 'light';
  if(newSkin !== ganttSkin){
    ganttSkin = newSkin;
    if(curView==='gantt' && selId && typeof applyView==='function') applyView('gantt');
  }
}

let curFilter = '전체';

const GCW = { week:24, month:38, quarter:58 };

function gGrad(st){ return ganttSkin==='obsidian' ? (GGRAD_OB[st]||GGRAD_OB['']) : (GGRAD[st]||GGRAD['']); }
function gPale(st){ return ganttSkin==='obsidian' ? (GPALE_OB[st]||GPALE_OB['']) : (GPALE[st]||GPALE['']); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── ZOOM MODAL (차트/메모 카드를 클릭하면 크게 보기) ──
   카드의 현재 DOM(즉 이미 그려진 svg 등 포함)을 그대로 복제해서 넣는다.
   id를 그대로 복제하면 문서에 중복 id가 생기므로 반드시 제거한다. */
function openZoomModal(html){
  const modal = document.getElementById('zoomModal');
  const body = document.getElementById('zoomModalBody');
  if(!modal || !body) return;
  body.innerHTML = html.replace(/\sid="[^"]*"/g, '');
  modal.classList.add('show');
  document.addEventListener('keydown', zoomModalEscHandler);
}
function closeZoomModal(){
  const modal = document.getElementById('zoomModal');
  if(modal) modal.classList.remove('show');
  document.removeEventListener('keydown', zoomModalEscHandler);
}
function zoomModalEscHandler(e){ if(e.key==='Escape') closeZoomModal(); }
function zoomEnCard(el){ openZoomModal(el.innerHTML); }
function zoomMemoBox(ev){
  if(ev.target.closest('a,.memo-hist-toggle,.memo-list')) return;
  const cur = document.getElementById('memo-current');
  if(!cur) return;
  openZoomModal(`<h4 style="margin-bottom:14px">📋 프로젝트 메모</h4>${cur.innerHTML}`);
}

/* ── DATA LOAD ── */
async function loadData(){
  const st = document.getElementById('status');
  st.textContent = '불러오는 중...';
  st.classList.remove('err');
  try{
    const res = await fetch(GANTT_API_URL);
    const json = await res.json();
    RAW.projects = json.projects || [];
    RAW.tasks = json.tasks || [];
    RAW.changes = json.changes || [];
    RAW.enroll = json.enroll || []; /* "모집실적" 로그 시트 — 아직 GAS/시트 준비 전이면 항상 빈 배열이라 목업 화면이 그대로 나온다 */
    /* "영업리드_마스터/영업일지_로그/원료계약_마스터/원료계약_로그" — 아직 GAS에서 안 내려주면 빈 배열,
       이 경우 buildPipelineView()가 자동으로 예시(목업) 데이터를 대신 보여준다 */
    RAW.pipelineLeads = json.pipelineLeads || [];
    RAW.pipelineLeadLog = json.pipelineLeadLog || [];
    RAW.pipelineMaterials = json.pipelineMaterials || [];
    RAW.pipelineMaterialLog = json.pipelineMaterialLog || [];
    renderFilterPills();
    renderPlist();
    updateHeaderStats();
    if(selId && RAW.projects.some(p=>p['ID']===selId)) renderDetail(selId);
    else if(selId){ selId=null; showEmptyDetail(); }
    if(pipelineMode) renderPipelineView();
    st.textContent = `✅ ${new Date().toLocaleTimeString('ko-KR')} 업데이트 · 프로젝트 ${RAW.projects.length}개 · 업무 ${RAW.tasks.length}개`;
  }catch(e){
    st.textContent = '⚠️ 데이터를 불러오지 못했습니다';
    st.classList.add('err');
    console.error(e);
  }
}

  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today-d)/86400000);
}

function isHold(t){ return t['홀딩']==='TRUE'||t['홀딩']===true; }
function isProjHold(p){ return !!p && p['상태']==='중단'; }
function isDone(t){ return t['상태']==='완료'||t['상태']==='종료'; }
function isProg(t){ return t['상태']==='진행 중'||t['상태']==='진행중'; }
function statusCls(t){ if(isHold(t)) return 's-hold'; if(isDone(t)) return 's-done'; if(isProg(t)) return 's-prog'; return 's-plan'; }
function statusLabel(t){ if(isHold(t)) return '홀딩'; return t['상태']||'예정'; }
function projTasks(pid){ return RAW.tasks.filter(t=>t['프로젝트ID']===pid); }

/* 업무 정렬: 같은 분류(카테고리) 안에서는 "업무ID" 순서로 정렬한다.
   업무ID는 "T1052A" 처럼 문자+숫자+문자(접미사)가 섞여 있어서 단순 문자열 비교(localeCompare)로는
   "T1000"이 "T999"보다 앞으로 오는 등 잘못 정렬될 수 있다.
   그래서 ID를 [글자 prefix, 숫자, 글자 suffix] 조각으로 나눠 숫자는 숫자답게, 나머지는 문자열로 비교하는
   "자연 정렬(natural sort)"을 사용한다. ID가 없는 업무는 맨 뒤로 보낸다. */
function idSortKey(id){
  const s = String(id||'').trim();
  if(!s) return null;
  const m = s.match(/^([^\d]*)(\d+)(.*)$/); // 예: "T1052A" -> ["T","1052","A"]
  if(m) return [m[1], parseInt(m[2],10), m[3]];
  return [s, 0, '']; // 숫자가 아예 없는 ID는 문자열만으로 비교
}
function taskSortKey(t){
  const k = idSortKey(t['ID'] ?? t['업무ID']);
  return k ? [0, k] : [1, null];
}
function cmpIdKey(a,b){
  // a,b는 [prefix, num, suffix]
  if(a[0]!==b[0]) return a[0]<b[0]?-1:1;
  if(a[1]!==b[1]) return a[1]-b[1];
  if(a[2]!==b[2]) return a[2]<b[2]?-1:1;
  return 0;
}
function sortTasksByDate(list){
  return list.map((t,i)=>({t,i})).sort((a,b)=>{
    const ka=taskSortKey(a.t), kb=taskSortKey(b.t);
    if(ka[0]!==kb[0]) return ka[0]-kb[0]; // ID 있는 업무를 먼저
    if(ka[0]===0) { const c = cmpIdKey(ka[1], kb[1]); if(c!==0) return c; }
    return a.i-b.i; // 안정 정렬: 동일 ID(있을 수 없지만 방어적으로)면 원래 순서 유지
  }).map(x=>x.t);
}
function rate(pid){
  const tasks = projTasks(pid);
  if(!tasks.length) return 0;
  const done = tasks.filter(isDone).length;
  return Math.round(done/tasks.length*100);
}

/* ── PROJECT HEADER COLLAPSE (부드러운 높이/투명도 애니메이션) ──
   display:none으로 즉시 사라지면 스크롤 중 이질감이 크므로, max-height/opacity를
   트랜지션으로 부드럽게 줄이고, 트랜지션 진행 중에는 매 프레임 간트 헤더 위치를
   다시 계산해서(syncGanttSticky) 아래 내용이 뚝뚝 끊기지 않고 따라오게 한다. */
let _dpAnimRAF = null;
function setDpCollapsed(collapse){
  const body = document.getElementById('dp-collapsible');
  const bar = document.getElementById('dp-stick-bar');
  if(!body) return;
  if(bar) bar.classList.toggle('show', collapse);
  if(collapse){
    body.style.maxHeight = body.scrollHeight + 'px';
    body.style.marginBottom = '';
    // eslint-disable-next-line no-unused-expressions
    body.offsetHeight; // 강제 리플로우: 트랜지션 시작점을 고정
    body.classList.add('dp-fading');
    body.style.maxHeight = '0px';
    body.style.marginBottom = '0px';
  }else{
    body.classList.remove('dp-fading');
    body.style.maxHeight = body.scrollHeight + 'px';
    body.style.marginBottom = '';
  }
  if(_dpAnimRAF) cancelAnimationFrame(_dpAnimRAF);
  const t0 = performance.now();
  const step = (t)=>{
    if(curView==='gantt') syncGanttSticky();
    if(t - t0 < 320){ _dpAnimRAF = requestAnimationFrame(step); }
    else{
      _dpAnimRAF = null;
      if(!collapse) body.style.maxHeight = 'none'; // 펼친 뒤엔 내용 변화에도 자연스럽게 대응
      if(curView==='gantt') syncGanttSticky();
    }
  };
  _dpAnimRAF = requestAnimationFrame(step);
}
function toggleDpSticky(e){
  if(e) e.stopPropagation();
  dpCollapsed = !dpCollapsed;
  setDpCollapsed(dpCollapsed);
}

/* ── 간트차트 헤더/범례/월 헤더를 프로젝트 정보창(dp-sticky) 바로 아래에 이어서 고정 ──
   dp-sticky의 높이가 접기/펼치기·메모 유무에 따라 달라지므로, 매번 실제 높이를 측정해서
   간트 쪽 고정 요소들의 top 값을 맞춰준다. (프로젝트 선택/뷰 전환/창 크기 변경/접기토글 시 호출) */
function syncGanttSticky(){
  const stickyEl = document.getElementById('dp-sticky-el');
  const ghdr = document.querySelector('#vgantt .ghdr');
  const gleg = document.querySelector('#vgantt .gleg');
  if(!stickyEl || !ghdr || !gleg) return;
  const h1 = stickyEl.offsetHeight;
  ghdr.style.top = h1 + 'px';
  const h2 = ghdr.offsetHeight;
  gleg.style.top = (h1+h2) + 'px';
  const h3 = gleg.offsetHeight;
  const base = h1 + h2 + h3;
  document.querySelectorAll('#vgantt .gyspacer').forEach(el=>{ el.style.top = base+'px'; });
  const gchw = document.querySelector('#vgantt .gcanvas-headwrap');
  if(gchw) gchw.style.top = base+'px';
  const h4 = 20; // gyspacer/gyhdrs 고정 높이
  document.querySelectorAll('#vgantt .glhdr').forEach(el=>{ el.style.top = (base+h4)+'px'; });
}
window.addEventListener('resize', ()=>{ if(curView==='gantt') syncGanttSticky(); });

function isMemo(c){ return (c['변경내용']||'').trim().startsWith('메모'); }
function isIssue(c){ return (c['변경내용']||'').trim().startsWith('이슈'); }
/* 업무별 이슈 목록: Changes 시트에서 같은 프로젝트+업무명, 변경내용이 "이슈"로 시작하는 항목을 모두 모음(날짜별 여러 건 가능).
   구버전 호환: Tasks 시트의 이슈일자/이슈내용 단일 필드도 있으면 함께 포함. */
function taskIssues(pid, t){
  const pname = projName(pid);
  const tname = t['업무명'];
  const out = [];
  (RAW.changes||[]).forEach(c=>{
    if(!isIssue(c)) return;
    if((c['프로젝트']||'')!==pname && (c['프로젝트']||'')!==pid) return;
    if((c['업무']||'')!==tname) return;
    const d = parseDateFlexible(c['시각']);
    if(!d) return;
    out.push({ date: gpd(d.toISOString()), note: (c['변경내용']||'').replace(/^이슈\s*:?\s*/,'') });
  });
  if(t['이슈일자']){
    const ld = gpd(t['이슈일자']);
    if(ld) out.push({ date: ld, note: t['이슈내용']||'' });
  }

}

/* ── STORY VIEW (per project) ── */
function feedColor(msg){
  msg = msg || '';
  if(msg.includes('상태')) return 'var(--primary)';
  if(msg.includes('홀딩')) return 'var(--hold)';
  if(msg.includes('날짜')||msg.includes('기간')||msg.includes('예상')||msg.includes('실제')) return 'var(--prog)';
  if(msg.includes('메모')) return 'var(--done)';
  if(msg.includes('추가')) return 'var(--plan-c)';
  if(msg.includes('삭제')) return 'var(--hold)';
  return 'var(--muted)';
}
/* "필드명: 이전값 → 이후값" 형태를 파싱해 이전값은 취소선, 이후값은 강조색으로 표시.
   화살표가 없는 항목("+ 새 업무 추가:" 등)은 그대로 둔다. */
function formatStoryDiff(msg){
  msg = esc(msg||'');
  const m = msg.match(/^(.*?)(:\s*)(.+?)\s*(→|-&gt;)\s*(.+)$/);
  if(!m) return msg;
  const [, field, colon, before, , after] = m;
  const fieldPart = field.trim() ? `<span class="story-field">${field.trim()}</span>${colon}` : '';
  return `${fieldPart}${before?`<span class="story-old">${before}</span><span class="story-arrow">→</span>`:'→'} <span class="story-new">${after}</span>`;
}
function buildStoryView(pid){
  const pname = projName(pid);
  let changes = (RAW.changes||[]).filter(c => (c['프로젝트']||'')===pname || (c['프로젝트']||'')===pid);
  changes.sort((a,b)=>{ const da=parseDateFlexible(a['시각']), db=parseDateFlexible(b['시각']); return (db?db.getTime():0)-(da?da.getTime():0); });
  if(!changes.length) return '<div class="empty">변경 이력이 없습니다</div>';
  const groups = [];
  let curKey = null;
  changes.slice(0,300).forEach(c=>{
    const label = dateGroupLabel(c['시각']);
    if(label !== curKey){ curKey = label; groups.push({label, items:[]}); }
    groups[groups.length-1].items.push(c);
  });
  const totalItems = groups.reduce((n,g)=>n+g.items.length,0);
  let seen = 0;
  return `<div class="story-feed">` + groups.map(g=>{
    return `<div class="story-date-hdr">${esc(g.label)} <span class="cnt">${g.items.length}건</span></div>` +
      g.items.map(c=>{
        seen++;
        const isLast = seen===totalItems;
        const color = feedColor(c['변경내용']);
        const who = c['사용자']||'알 수 없음';
        const initial = String(who).trim()[0]||'?';
        let timeStr = String(c['시각']||'');
        const tm = timeStr.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/);
        const short = tm ? (tm[1]||'')+' '+tm[2]+':'+tm[3] : '';
        return `<div class="story-item">
          <div class="story-rail">
            <div class="story-dot" style="background:${color}"></div>
            ${isLast?'':'<div class="story-line"></div>'}
          </div>
          <div class="story-content">
            <div class="story-top">
              <span class="story-avatar">${esc(initial)}</span>
              <span class="story-user">${esc(who)}</span>
              <span class="story-time">${esc(short)}</span>
              <span class="story-proj">${esc(c['업무']||pname)}</span>
            </div>
            <div class="story-msg">${formatStoryDiff(c['변경내용'])}</div>
          </div>
        </div>`;
      }).join('');
  }).join('') + `</div>`;
}

function dateGroupLabel(str){
  const d = parseDateFlexible(str);
  if(!d) return '날짜 미상';
  const today = new Date(); today.setHours(0,0,0,0);
  const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
  const diff = Math.round((today-dOnly)/86400000);
  const mo = d.getMonth()+1, da = d.getDate();
  if(diff===0) return `🔵 오늘 (${mo}월 ${da}일)`;
  if(diff===1) return `어제 (${mo}월 ${da}일)`;
  if(diff>=0 && diff<=7) return `${diff}일 전 (${mo}월 ${da}일)`;
  return `${d.getFullYear()}년 ${mo}월 ${da}일`;
}
function parseDateFlexible(str){
  if(!str) return null;
  let s = String(str).trim();
  const isPM = s.includes('오후'), isAM = s.includes('오전');
  s = s.replace(/오전\s*/g,'').replace(/오후\s*/g,'');
  const m = s.match(/(\d{4})[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})\.?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m){
    let h=+m[4]; if(isPM && h<12) h+=12; if(isAM && h===12) h=0;
    return new Date(+m[1], +m[2]-1, +m[3], h, +m[5], +(m[6]||0));
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* ── 임상대상자 모집현황 ──
   "모집실적" 로그 시트(RAW.enroll)에 실제 기록이 있으면 그걸 집계해서 보여주고,
   아직 하나도 없는 프로젝트는 프로토타입 목업(결정론적 가짜 수치)으로 화면 형태만 보여준다.
   로그 한 행 = {날짜, 프로젝트ID, 구분('스크리닝'|'스크리닝 페일'|'엔롤'|'드롭아웃'), 인원수, 기관(선택)} */
function seedRand(seed){
  let h = 0;
  for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) | 0; }
  return function(){ h = (h*1103515245 + 12345) | 0; return ((h>>>0) % 10000) / 10000; };
}
function mockEnrollData(pid, p){
  const rnd = seedRand(String(pid||'x'));
  const startRaw = p && (p['시작일']||p['모집시작일']);
  const start = gpd(startRaw) || new Date();
  const today = new Date(); today.setHours(0,0,0,0);
  const elapsed = Math.round((today-start)/86400000);
  const started = elapsed >= 0;
  const targetDays = 150 + Math.floor(rnd()*120);
  const screen = started ? 30 + Math.floor(rnd()*130) : 0;
  const fail = started ? Math.floor(screen*(0.1+rnd()*0.22)) : 0;
  const enroll = started ? Math.max(0, screen-fail-Math.floor(rnd()*5)) : 0;
  const enrollTarget = Math.max(enroll+5, Math.floor(screen*(0.75+rnd()*0.35))||60);
  const drop = started ? Math.floor(enroll*(0.02+rnd()*0.12)) : 0;
  const siteNames = ['서울센터병원','분당중앙병원','대구성모병원','부산해운대병원','광주기독병원'];
  const nSites = started ? 2+Math.floor(rnd()*4) : 0;
  let remain = enroll;
  const sites = [];
  for(let i=0;i<nSites;i++){
    const isLast = i===nSites-1;
    const cur = isLast ? remain : Math.min(remain, Math.floor(enroll/nSites*(0.6+rnd()*0.8)));
    remain -= cur;
    sites.push({ n: siteNames[i%siteNames.length], cur, target: Math.max(cur, Math.ceil(cur*(1.05+rnd()*0.35))) });

/* "모집실적" 로그를 프로젝트별로 집계 — 기록이 하나도 없으면 hasData:false */
function realEnrollAgg(pid, p){
  const rows = (RAW.enroll||[]).filter(r => String(r['프로젝트ID']||'')===String(pid||''));
  if(!rows.length) return { hasData:false };
  const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
  let screen=0, fail=0, enroll=0, drop=0;
  const siteMap = {};
  const enrollEvents = [];
  const screenEvents = [];
  rows.forEach(r=>{
    const kind = String(r['구분']||'').trim();
    const n = num(r['인원수']);
    const dt = parseDateFlexible(r['날짜']) || gpd(r['날짜']);
    /* AppSheet Enum 실제값(스크리닝실패/랜덤배정)과 기존 표기(스크리닝 페일/엔롤)를 모두 인식 */
    if(kind==='스크리닝'){ screen += n; if(dt) screenEvents.push({date:dt, n}); }
    else if(kind==='스크리닝 페일' || kind==='스크리닝실패') fail += n;
    else if(kind==='엔롤' || kind==='랜덤배정'){
      enroll += n;
      if(dt) enrollEvents.push({date:dt, n});
      const site = String(r['기관']||'').trim();
      if(site) siteMap[site] = (siteMap[site]||0) + n;
    }
    else if(kind==='드롭아웃') drop += n;
  });
  enrollEvents.sort((a,b)=>a.date-b.date);
  screenEvents.sort((a,b)=>a.date-b.date);
  const firstDates = [];
  if(screenEvents.length) firstDates.push(screenEvents[0].date);
  if(enrollEvents.length) firstDates.push(enrollEvents[0].date);
  const start = firstDates.length ? new Date(Math.min(...firstDates.map(d=>d.getTime()))) : (gpd(p&&p['시작일']) || new Date());
  const today = new Date(); today.setHours(0,0,0,0);
  const elapsed = Math.max(0, Math.round((today-start)/86400000));
  let cum = 0;
  const timeline = enrollEvents.map(e=>{ cum += e.n; return {date:e.date, cum}; });
  let scum = 0;
  const screenTimeline = screenEvents.map(e=>{ scum += e.n; return {date:e.date, cum:scum}; });
  const sites = Object.entries(siteMap).map(([n,cur])=>({n,cur})).sort((a,b)=>b.cur-a.cur);
  const targetRaw = p && p['목표엔롤인원'];
  const enrollTarget = (targetRaw!==undefined && targetRaw!==null && targetRaw!=='') ? num(targetRaw) : null;
  const targetEndRaw = p && p['목표종료일'];
  const startRaw = p && p['시작일'];
  const targetDays = (startRaw && targetEndRaw && gpd(startRaw) && gpd(targetEndRaw))
    ? Math.round((gpd(targetEndRaw)-gpd(startRaw))/86400000) : null;
  const targetEnd = gpd(targetEndRaw);
  return { hasData:true, started:true, elapsed, targetDays, screen, fail, enroll, drop, enrollTarget, targetEnd, sites, start, timeline, screenTimeline };
}

function renderEnrollCharts(pid){
  if(!pid) return;

  const real = realEnrollAgg(pid, p);
  const isMock = !real.hasData;

  const enDonut = (el, pct, color) => {
    if(!el) return;
    const r=16, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
    el.innerHTML = `<circle cx="21" cy="21" r="${r}" fill="none" stroke="${primaryLt}" stroke-width="5"/>
      <circle cx="21" cy="21" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 21 21)"/>`;
  };
  enDonut(donutFail, failRate, holdC);
  enDonut(donutDrop, dropRate, progC);

  const svg = document.getElementById('en-linechart');
  if(!svg) return;

  const cs2 = cs;
  const muted = cs2.getPropertyValue('--muted').trim() || '#888';
  const border = cs2.getPropertyValue('--border').trim() || '#eee';
  const primary = cs2.getPropertyValue('--primary').trim() || '#3B5BDB';
  const planC = cs2.getPropertyValue('--plan-c').trim() || '#4f5e73';

  /* actualPts/screenPts/targetPts: [xPixel, rawValue] 쌍 — y좌표 변환은 아래서 maxY 확정 후 일괄 처리 */
  let actualPts, screenPts=null, targetPts=null, maxVal;
  let todayX=null, axisExtended=false, axisEndLabel='';
  if(isMock){
    const pts = Math.max(2, Math.min(26, d.elapsed||1));
    const ease = t => 1-Math.pow(1-t,2);
    const actual = Array.from({length:pts},(_,i)=> Math.round(ease(i/(pts-1)) * d.enroll));
    const screenArr = Array.from({length:pts},(_,i)=> Math.round(ease(i/(pts-1)) * d.screen));
    const target = Array.from({length:pts},(_,i)=> Math.round((i/(pts-1)) * d.enrollTarget));
    const xAt = i => padL + (W-padL-padR) * (i/(pts-1));
    actualPts = actual.map((v,i)=>[xAt(i), v]);
    screenPts = screenArr.map((v,i)=>[xAt(i), v]);
    targetPts = target.map((v,i)=>[xAt(i), v]);
    maxVal = Math.max(d.enrollTarget, d.enroll, d.screen);
    todayX = actualPts[actualPts.length-1][0];
  } else {
    const today = new Date(); today.setHours(0,0,0,0);
    /* 목표종료일이 오늘보다 뒤라면 축을 거기까지 늘려서, 목표선이 "오늘까지 다 채워야 함"처럼
       보이지 않고 실제 남은 기간에 걸친 필요 페이스를 보여주도록 함 */

    axisExtended = hasRealTargetEnd;
    if(axisExtended) axisEndLabel = `목표종료 ${gdshort(axisEnd)}`;
    const totalMs = Math.max(1, axisEnd - d.start);
    const xAt = dt => padL + (W-padL-padR) * Math.min(1, Math.max(0, (dt-d.start)/totalMs));
    const series = [{date:d.start, cum:0}, ...d.timeline];
    if(!series.length || series[series.length-1].date.getTime() !== today.getTime()){
      series.push({date: today, cum: d.enroll});
    }
    actualPts = series.map(pt=>[xAt(pt.date), pt.cum]);
    const screenSeries = [{date:d.start, cum:0}, ...(d.screenTimeline||[])];
    if(!screenSeries.length || screenSeries[screenSeries.length-1].date.getTime() !== today.getTime()){
      screenSeries.push({date: today, cum: d.screen});
    }
    screenPts = screenSeries.map(pt=>[xAt(pt.date), pt.cum]);
    maxVal = Math.max(d.enroll, d.screen);
    if(hasTarget){
      maxVal = Math.max(maxVal, d.enrollTarget);
      targetPts = [[xAt(d.start), 0], [xAt(axisEnd), d.enrollTarget]];
    }
    todayX = xAt(today);
  }
  const maxY = Math.max(10, Math.ceil(maxVal*1.15/10)*10 || 10);
  const yAt = v => H-padB - (H-padT-padB) * (v/maxY);
  const steps = [0, Math.round(maxY*0.25), Math.round(maxY*0.5), Math.round(maxY*0.75), maxY];
  let grid='';
  steps.forEach(v=>{
    const y=yAt(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${border}" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="${muted}">${v}</text>`;
  });
  const linePath = ps => ps.map((pt,i)=>(i===0?'M':'L')+pt[0].toFixed(1)+','+yAt(pt[1]).toFixed(1)).join(' ');
  const lastX = actualPts[actualPts.length-1][0];
  const firstX = actualPts[0][0];
  const areaPath = linePath(actualPts) + ` L${lastX},${H-padB} L${firstX},${H-padB} Z`;
  /* 목표선 끝에 숫자 라벨(예: "목표 120") — 선이 차트 위쪽 가장자리에 너무 붙으면 라벨이 잘리므로 살짝 아래로 내림 */
  let targetLabel = '';
  if(targetPts){
    const tEnd = targetPts[targetPts.length-1];
    const ly = Math.max(padT+9, yAt(tEnd[1])-6);
    targetLabel = `<text x="${tEnd[0]-2}" y="${ly}" text-anchor="end" font-size="9.5" font-weight="600" fill="${holdC}">목표 ${Math.round(tEnd[1])}</text>`;
  }
  svg.innerHTML = `
    <defs><linearGradient id="enAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${primary}" stop-opacity=".22"/><stop offset="100%" stop-color="${primary}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${areaPath}" fill="url(#enAreaGrad)" stroke="none"/>
    ${screenPts?`<path d="${linePath(screenPts)}" fill="none" stroke="${planC}" stroke-width="2" stroke-dasharray="3 2.5"/>`:''}
    ${targetPts?`<path d="${linePath(targetPts)}" fill="none" stroke="${holdC}" stroke-width="1.6" stroke-dasharray="4 3"/>`:''}
    <path d="${linePath(actualPts)}" fill="none" stroke="${primary}" stroke-width="2.2"/>
    ${targetLabel}
    <line x1="${todayX}" y1="${padT}" x2="${todayX}" y2="${H-padB}" stroke="${muted}" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="${padL}" y="${H-4}" font-size="9" fill="${muted}">Start</text>
    ${axisExtended
      ? `<text x="${todayX}" y="${H-4}" text-anchor="middle" font-size="9" fill="${muted}">Today</text>
         <text x="${W-padR}" y="${H-4}" text-anchor="end" font-size="9" fill="${muted}">${axisEndLabel}</text>`
      : `<text x="${W-padR}" y="${H-4}" text-anchor="end" font-size="9" fill="${muted}">Today</text>`}
  `;
}

/* ── GANTT (v6-style dual-panel synced chart) ── */
function gpd(s){ if(!s) return null; const d=new Date(s); d.setHours(0,0,0,0); return isNaN(d.getTime())?null:d; }
function dOnly(s){ const d=gpd(s); return d?gds(d):(s||''); }
function gds(d){ return d?d.toISOString().slice(0,10):''; }
function gdshort(d){ return d?`${d.getMonth()+1}/${d.getDate()}`:'?'; }
function gfm(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
function gfq(d){ return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1); }
function gam(d,n){ const r=new Date(d); r.setMonth(r.getMonth()+n); return r; }
function gad(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function gCols(minD,maxD,z,hideWknd){
  const cols=[];
  let c=z==='week'?new Date(minD):z==='month'?gfm(minD):gfq(minD);
  while(c<=maxD){
    const skip = z==='week' && hideWknd && (c.getDay()===0||c.getDay()===6);
    if(!skip) cols.push(new Date(c));
    if(z==='week') c=gad(c,1); else if(z==='month') c=gam(c,1); else c=gam(c,3);
  }
  return cols;
}
function gci(cols,d){ if(!d) return -1; for(let i=cols.length-1;i>=0;i--){ if(d>=cols[i]) return i; } return 0; }

    }));

  if(!dated.length){ gc.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted);font-size:13px">날짜가 입력된 업무가 없습니다</div>'; return; }
  const allD = dated.flatMap(r=>[r.s,r.e,r.ps,r.pe,r.as2,r.ae2]).filter(Boolean);
  let mn=new Date(Math.min(...allD)), mx=new Date(Math.max(...allD));
  if(gZoom==='week'){ mn=gad(mn,-14); mx=gad(mx,21); }
  else if(gZoom==='month'){ mn=gfm(gam(mn,-1)); mx=gam(gfm(mx),2); }
  else{ mn=gfq(gam(mn,-3)); mx=gam(gfq(mx),6); }

  const cols = gCols(mn,mx,gZoom,hideWeekend);
  if(cols.length>0){
    const availW = Math.max(0, gc.clientWidth - 220);
    const natural = cols.length*cw;
    if(natural < availW) cw = availW/cols.length;
  }
  const tw = cols.length*cw;
  const ti = gci(cols,today);

  let hh='', pm=-1;
  cols.forEach((c,i)=>{
    const isTd = i===ti;
    let lb='';
    const isWknd = gZoom==='week' && (c.getDay()===0||c.getDay()===6);
    if(gZoom==='week'){ lb = (c.getDate()===1||i===0) ? `${c.getMonth()+1}/${c.getDate()}` : `${c.getDate()}`; }
    else if(gZoom==='month'){ if(c.getMonth()!==pm){ lb = `${c.getFullYear()}.${String(c.getMonth()+1).padStart(2,'0')}`; pm=c.getMonth(); } }
    else{ if(c.getMonth()%3===0 && c.getMonth()!==pm){ lb = `${c.getFullYear()} Q${Math.floor(c.getMonth()/3)+1}`; pm=c.getMonth(); } }
    const isMS = gZoom!=='month' && (c.getDate()===1);
    hh += `<div class="gchdr${isMS?' gms':''}${isTd?' gtd':''}${isWknd?' gwknd':''}" style="width:${cw}px;min-width:${cw}px">${lb}</div>`;
  });

  let yh='';
  { let i=0;
    while(i<cols.length){
      const yr = cols[i].getFullYear();
      let j=i; while(j<cols.length && cols[j].getFullYear()===yr) j++;
      yh += `<div class="gyhdr" style="left:${i*cw}px;width:${(j-i)*cw}px">${yr}년</div>`;
      i=j;
    }
  }

  let lh='', rh='';
  rows.forEach(row=>{
    const isCat = row.k==='cat';
    const subS = isCat ? row.s : (row.ps||row.as2);
    const subE = isCat ? row.e : (row.pe||row.ae2);
    let subLine = '';
    if(subS){
      const durDays = subE ? Math.max(1, Math.round((subE-subS)/86400000)+1) : null;
      subLine = `<span class="glsub">${gdshort(subS)}${durDays?` · ${durDays}일`:''}</span>`;
    }
    const rowClick = (!isCat && row.id) ? ` onclick="openTaskInAppSheet('${esc(row.id)}',event)" style="cursor:pointer" title="${esc(row.lb)} — 클릭하면 AppSheet에서 이 업무를 바로 엽니다"` : ` title="${esc(row.lb)}"`;
    lh += `<div class="glrow${isCat?' glcat':''}"${rowClick}><span class="gllabel">${esc(row.lb)}</span>${subLine}</div>`;
    let cells='';
    cols.forEach((c,i)=>{
      const isWknd = gZoom==='week' && (c.getDay()===0||c.getDay()===6);
      cells+=`<div class="gcell${i===ti?' gtd':''}${isWknd?' gwknd':''}" style="width:${cw}px;min-width:${cw}px"></div>`;
    });
    let bar='';
    if(isCat){
      if(row.s && row.e){
        const si=Math.max(0,gci(cols,row.s)), ei=Math.min(cols.length-1,gci(cols,row.e));
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const catBg = ganttSkin==='obsidian' ? '#4a4436' : '#8a8272';
        bar = `<div class="gbar gbcat" style="left:${left}px;width:${width}px;background:${catBg}"><span class="gbarlbl">${esc(row.lb)}</span></div>`;
      }
    } else {
      const lb = row.lb.length>22 ? row.lb.slice(0,20)+'…' : row.lb;
      const rowH = 48;
      /* 예상(plan)·실제(actual) 밴드를 동일 위치·동일 두께로 겹치게: actual이 plan 위에 그려져
         실제 진행된 구간은 actual 색이, 아직 실제가 없는 구간은 plan의 옅은 유령색이 비쳐 보임 */
      const BT=0.28, BH=0.40;
      /* 날짜 라벨은 행마다 "하나"만 만들어서 세로 중앙(50%)에 배치 — 예전에는 예상/실제 라벨을
         행 위쪽·아래쪽에 각각 따로 띄웠는데, 행이 촘촘하면 아래쪽 라벨이 다음 행 위쪽 라벨과
         겹쳐서 글자가 뒤섞이는 문제가 있었음. 항상 한 줄로 합쳐서 표시하면 그 문제 자체가 없어짐 */
      let dateLabelText = '', labelLeft = 0;
      let planBar='';
      if(row.ps && row.pe){
        const si=Math.max(0,gci(cols,row.ps)), ei=Math.min(cols.length-1,gci(cols,row.pe));
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const paleKey = row.st==='홀딩' ? '홀딩' : (row.st||'');
        planBar = `<div class="gbar-plan" style="top:${rowH*BT}px;height:${rowH*BH}px;left:${left}px;width:${width}px;background:${gPale(paleKey)}"></div>`;
        labelLeft = Math.max(labelLeft, left+width);
      }
      let actBar='';
      const cursorCss = row.id ? 'cursor:pointer;' : '';
      const barClick = row.id ? ` onclick="openTaskInAppSheet('${esc(row.id)}',event)"` : '';
      if(row.as2 && row.ae2){
        const si=Math.max(0,gci(cols,row.as2)), ei=Math.min(cols.length-1,gci(cols,row.ae2));
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const tipStr = `data-tip="${esc(row.lb)}|예상:${gds(row.ps)||'?'}~${gds(row.pe)||'?'} / 실제:${gds(row.as2)}~${gds(row.ae2)}|${row.st||'미정'}|${row.asg}"`;
        actBar = `<div class="gbar-actual gbtask" style="${cursorCss}top:${rowH*BT}px;height:${rowH*BH}px;left:${left}px;width:${width}px;background:${gGrad(row.st)}" ${tipStr}${barClick}><span class="gbarlbl">${row.st==='홀딩'?'🔴 ':''}${lb}</span></div>`;
        labelLeft = Math.max(labelLeft, left+width);
        dateLabelText = (row.ps&&row.pe) ? `예상 ${gdshort(row.ps)}~${gdshort(row.pe)} · 실제 ${gdshort(row.as2)}~${gdshort(row.ae2)}` : `실제 ${gdshort(row.as2)}~${gdshort(row.ae2)}`;
      } else if(row.as2 && !row.ae2){
        const si=Math.max(0,gci(cols,row.as2));
        const todayI = gci(cols,today);
        const ei=Math.min(cols.length-1,todayI);
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const isOverdue = row.pe && today>row.pe;
        const stKey = row.st==='홀딩' ? '홀딩' : (isOverdue ? '연체' : (row.st||'진행중'));
        let wipExt='';
        if(row.pe && !isOverdue){
          const extSi=todayI, extEi=Math.min(cols.length-1,gci(cols,row.pe));
          const extW=Math.max((extEi-extSi+1)*cw-2,0);
          if(extW>0) wipExt = `<div class="gbar-wip-ext" style="top:${rowH*BT}px;height:${rowH*BH}px;left:${extSi*cw}px;width:${extW}px;background:${gGrad(stKey)}"></div>`;
        }
        const overdueStr = isOverdue ? ` 🔴+${Math.round((today-row.pe)/86400000)}일 초과` : '';
        const tipStr = `data-tip="${esc(row.lb)}|진행중: ${gds(row.as2)}~오늘${overdueStr}|${row.st||'미정'}|${row.asg}"`;
        actBar = `<div class="gbar-actual gbtask" style="${cursorCss}top:${rowH*BT}px;height:${rowH*BH}px;left:${left}px;width:${width}px;background:${gGrad(stKey)}" ${tipStr}${barClick}><span class="gbarlbl">⏳ ${lb}</span></div>${wipExt}`;
        labelLeft = Math.max(labelLeft, left+width);
        if(row.pe && !isOverdue){
          const extEi=Math.min(cols.length-1,gci(cols,row.pe));
          labelLeft = Math.max(labelLeft, (extEi+1)*cw);
        }
        dateLabelText = (row.ps&&row.pe) ? `예상 ${gdshort(row.ps)}~${gdshort(row.pe)} · 실제 ${gdshort(row.as2)}~진행중${overdueStr}` : `실제 ${gdshort(row.as2)}~진행중${overdueStr}`;
      } else if(row.ps && row.pe){
        const si=Math.max(0,gci(cols,row.ps)), ei=Math.min(cols.length-1,gci(cols,row.pe));
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const isOverdue = today>row.pe;
        const stKey = row.st==='홀딩' ? '홀딩' : (isOverdue ? '연체' : (row.st||'예정'));
        const tipStr = `data-tip="${esc(row.lb)}|예상:${gds(row.ps)}~${gds(row.pe)}${isOverdue&&row.st!=='홀딩'?' 🔴미시작 초과':''}|${row.st||'미정'}|${row.asg}"`;
        actBar = `<div class="gbar-actual gbtask" style="${cursorCss}top:${rowH*BT}px;height:${rowH*BH}px;left:${left}px;width:${width}px;background:${gGrad(stKey)};opacity:${row.st==='홀딩'?1:(isOverdue?1:.85)}" ${tipStr}${barClick}><span class="gbarlbl">${row.st==='홀딩'?'🔴 ':''}${lb}</span></div>`;
        labelLeft = Math.max(labelLeft, left+width);
        dateLabelText = `예정 ${gdshort(row.ps)}~${gdshort(row.pe)}${isOverdue&&row.st!=='홀딩'?' 🔴초과':''}`;
      }
      const dateLabel = dateLabelText ? `<span class="gdatelbl" style="left:${labelLeft+5}px;top:50%;transform:translateY(-50%)">${dateLabelText}</span>` : '';
      let issueMark = '';
      if(row.issues && row.issues.length){
        const byDate = {};
        row.issues.forEach(iss=>{
          const key = gds(iss.date);
          (byDate[key]=byDate[key]||[]).push(iss);
        });
        Object.entries(byDate).forEach(([dkey,list])=>{
          const ii = gci(cols, list[0].date);
          if(ii>=0){
            const ix = ii*cw + cw/2;
            const noteJoined = list.map(x=>esc(x.note||'상세 내용 없음')).join(' / ');
            const issTip = `${dkey}|${esc(row.lb)}|${noteJoined}${list.length>1?` (${list.length}건)`:''}`;
            const badge = list.length>1 ? `<span class="gissue-cnt">${list.length}</span>` : '';
            issueMark += `<div class="gissue" style="left:${ix}px" data-issue="${issTip}">🚩${badge}</div>`;
          }
        });
      }
      let memoMark = '';
      if(row.memo){
        const endDate = row.ae2 || row.pe || row.as2 || row.ps;
        if(endDate){
          const ei2 = Math.min(cols.length-1, gci(cols, endDate));
          if(ei2>=0){
            const mx = ei2*cw + cw - 6;
            const memoTip = `${esc(row.lb)}|${esc(row.memo)}`;
            memoMark = `<div class="gmemo-flag" style="left:${mx}px;top:${rowH*0.02}px" data-memo="${memoTip}">🚩</div>`;
          }
        }
      }
      let milestoneMark = '';
      if(row.ps && row.pe && row.ps.getTime()===row.pe.getTime() && !row.as2){
        const mi = gci(cols, row.ps);
        if(mi>=0){
          const mx = mi*cw + cw/2;
          const msTip = `data-tip="${esc(row.lb)}|마일스톤: ${gds(row.ps)}|${row.st||'미정'}|${row.asg}"`;
          milestoneMark = `<div class="gmilestone" style="left:${mx}px" ${msTip}></div>`;
        }
      }
      bar = planBar+actBar+dateLabel+issueMark+memoMark+milestoneMark;
    }
    rh += `<div class="grow${isCat?' grcat':''}" style="width:${tw}px"><div style="position:absolute;inset:0;display:flex">${cells}</div>${bar}</div>`;
  });

  const tl = ti>=0 ? ti*cw+cw/2-1 : -9999;
  /* gcanvas(가로 스크롤 영역) 자체를 sticky 기준으로 쓰면 브라우저가 overflow-x:auto인 요소를
     세로 스크롤 컨테이너로도 취급해버려서(오버플로우 규칙상 강제) 월/연도 헤더가 #dp 기준으로
     고정되지 않는 문제가 있었음. 그래서 헤더 행(연도·월)은 별도의 overflow:hidden 래퍼로 분리해
     #dp를 기준으로 정상적으로 sticky 처리하고, 가로 스크롤 위치만 JS로 본문과 동기화한다. */
  gc.innerHTML = `<div class="ginner">
    <div class="glabels"><div class="gyspacer"></div><div class="glhdr">업무</div>${lh}</div>
    <div class="gcanvas-wrap">
      <div class="gcanvas-headwrap" id="gchw"><div style="width:${tw}px">
        <div class="gyhdrs">${yh}</div>
        <div class="gchdrs">${hh}</div>
      </div></div>
      <div class="gcanvas" id="gcv">
        <div class="gcinner" style="width:${tw}px">
          <div style="position:relative">
            <div class="gtvline" style="left:${tl}px"></div>
            <div class="gtflag" style="left:${tl-14}px">TODAY</div>
            ${rh}
          </div>
        </div>
      </div>
    </div>
  </div>`;
  { const gcv=document.getElementById('gcv'), gchw=document.getElementById('gchw');
    if(gcv && gchw) gcv.addEventListener('scroll', ()=>{ gchw.scrollLeft = gcv.scrollLeft; }); }

  const tip = document.getElementById('gtip');
  if(tip){
    gc.querySelectorAll('[data-tip]').forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        const p = el.dataset.tip.split('|');
        tip.innerHTML = `<strong>${p[0]}</strong>📅 ${p[1]}<br>상태: ${p[2]}<br>담당: ${p[3]}`;
        tip.style.display = 'block';
      });
      el.addEventListener('mousemove', e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px'; });
      el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
    });
    gc.querySelectorAll('[data-issue]').forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        const p = el.dataset.issue.split('|');
        tip.innerHTML = `<strong>⚠️ 이슈 · ${p[1]}</strong>📅 ${p[0]}<br>${p[2]}`;
        tip.style.display = 'block';
      });
      el.addEventListener('mousemove', e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px'; });
      el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
      el.addEventListener('click', e=>{ e.stopPropagation(); });
    });
    gc.querySelectorAll('[data-memo]').forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        const p = el.dataset.memo.split('|');
        tip.innerHTML = `<strong>📝 메모 · ${p[0]}</strong>${p[1]}`;
        tip.style.display = 'block';
      });
      el.addEventListener('mousemove', e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px'; });
      el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
      el.addEventListener('click', e=>{ e.stopPropagation(); });
    });
  }
  const cv = document.getElementById('gcv');
  if(cv && tl>0) setTimeout(()=>{ cv.scrollLeft = tl - cv.offsetWidth*0.38; },60);
  syncGanttSticky();
}

function setGZ(z){
  gZoom = z;
  ['week','month','quarter'].forEach(zz=>{
    const b = document.getElementById('gz-'+zz);
    if(b) b.classList.toggle('on', zz===z);
  });
  drawGantt(selId);
}
function toggleWeekend(){
  hideWeekend = !hideWeekend;
  const b = document.getElementById('gz-wknd');
  if(b) b.classList.toggle('on', hideWeekend);
  drawGantt(selId);
}
function gToday(){
  const cv = document.getElementById('gcv');
  const tl = document.querySelector('.gtvline');
  if(cv && tl) cv.scrollLeft = parseFloat(tl.style.left) - cv.offsetWidth*0.38;
}

/* 상세 패널(#dp)을 스크롤할 때 프로젝트 정보창이 자동으로 접히던 동작은
   사용자 요청으로 비활성화함 — 이제는 수동 "▲ 접기" 버튼으로만 접고 편다.
   (스크롤 위치에 따라 간트 헤더 sticky 위치만 계속 동기화) */
(function initDpScrollCollapse(){
  const dp = document.getElementById('dp');
  if(!dp) return;
  dp.addEventListener('scroll', ()=>{
    if(curView==='gantt') syncGanttSticky();
  });
})();

/* ── AppSheet 딥링크 지원 ──
   "간트차트 가기" 등 AppSheet 액션이 ?p=<프로젝트ID>&view=<task|gantt|story|enroll> 형태로
   진입시키므로, loadData()가 데이터를 받아온 뒤 해당 프로젝트·탭을 바로 열어주도록
   selId/curView를 URL에서 미리 읽어둔다. (loadData() 안의
   `if(selId && RAW.projects.some(...)) renderDetail(selId)` 로직이 이 값을 그대로 사용) */
(function initFromUrl(){
  try{
    const params = new URLSearchParams(location.search);
    const p = params.get('p') || params.get('id') || params.get('project');
    const view = params.get('view');
    if(p) selId = p;
    if(view && ['task','gantt','story','enroll'].includes(view)) curView = view;
  }catch(e){}
})();

loadData();
setInterval(loadData, 60000);
</script>
</body>
