<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아리비앤씨 프로젝트 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f7;--card:#fff;--primary:#3B5BDB;--primary-lt:#E7EEFF;
  --text:#1a1d2e;--muted:#6b7280;--border:#e5e7eb;
  --done:#10b981;--prog:#f59e0b;--plan-c:#818cf8;--hold:#dc2626;--today:#f59e0b;
  --sh:0 1px 4px rgba(0,0,0,.08);
}
body{font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text)}

/* HEADER */
.hdr{background:linear-gradient(135deg,#111c4e,#2541b2 55%,#3B5BDB);color:#fff;padding:16px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(30,58,138,.25);position:sticky;top:0;z-index:30}
.hdr h1{font-size:18px;font-weight:800}
.hdr p{font-size:11.5px;opacity:.75;margin-top:2px}
.hdr-btn{padding:6px 13px;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;font-weight:700}
.hdr-btn:hover{background:rgba(255,255,255,.2)}
.hdr-stats{margin-left:auto;display:flex;gap:18px}
.hs .n{font-size:21px;font-weight:800;text-align:center}
.hs .l{font-size:10px;opacity:.75;text-align:center}
.status-line{font-size:11px;opacity:.85}
.status-line.err{color:#fecaca;font-weight:700}

/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border);padding:9px 28px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.nav input{flex:1;min-width:180px;padding:7px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none}
.nav input:focus{border-color:var(--primary)}
.fb{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:#fff;cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s;white-space:nowrap}
.fb.on{background:var(--primary-lt);border-color:var(--primary);color:var(--primary);font-weight:700}

/* LAYOUT */
.main{display:flex;min-height:calc(100vh - 128px)}

/* PROJECT LIST */
.plist{width:300px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 128px)}
.pc{padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.pc:hover{background:#f8f9ff}
.pc.on{background:var(--primary-lt);border-left:3px solid var(--primary)}
.pc.hold-proj{border-left:3px solid var(--hold)}
.pid{font-size:10px;color:var(--muted);font-family:monospace}
.pname{font-size:13px;font-weight:700;margin:2px 0 3px}
.pfunc{font-size:11.5px;color:var(--primary);margin-bottom:4px}
.pmeta{font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}
.tbadge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;background:#e0e7ff;color:#4338ca;margin-bottom:3px}
.pbar{margin-top:6px;height:3px;background:var(--border);border-radius:2px}
.pfill{height:100%;background:var(--done);border-radius:2px;transition:width .3s}
.no-res{padding:32px;text-align:center;color:var(--muted);font-size:13px}

/* DETAIL */
.dp{flex:1;overflow-y:auto;max-height:calc(100vh - 128px);padding:22px 26px}
.dp.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted)}
.dp.empty .ei{font-size:52px;margin-bottom:10px;opacity:.3}

.dp-sticky{position:sticky;top:0;z-index:15;background:var(--bg);margin-bottom:8px}
.dp-stick-bar{display:none;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:10px;padding:8px 16px;box-shadow:var(--sh);cursor:pointer;user-select:none}
.dp-stick-bar:hover{background:#fafbff}
.dp-stick-bar.show{display:flex}
.dp-stick-name{font-size:13px;font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-stick-id{font-size:10.5px;color:var(--muted);font-weight:700;font-family:monospace;margin-left:6px}
.dp-stick-toggle{font-size:11px;font-weight:700;color:var(--primary);white-space:nowrap;display:flex;align-items:center;gap:4px;flex-shrink:0}
.dp-collapsible{transition:none}
.dh{background:#fff;border-radius:11px;padding:9px 20px 7px;box-shadow:var(--sh);margin-bottom:6px}
.dh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.dh h2{font-size:15.5px;font-weight:800;margin-bottom:1px}
.ftag{display:inline-block;background:var(--primary);color:#fff;padding:1px 8px;border-radius:6px;font-size:10.5px;margin-bottom:0}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;margin-top:5px}
.mi{min-width:0}
.mi label{font-size:9.5px;color:var(--muted);display:block;margin-bottom:0}
.mi span{font-size:11.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi.wide{grid-column:1/-1}
.mi.wide span{white-space:pre-wrap}

.memo-box{background:#fff;border-radius:10px;padding:8px 16px;box-shadow:var(--sh);margin-bottom:8px}
.memo-box h4{font-size:11.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.memo-box h4 a{font-size:10px;font-weight:700;color:var(--primary);text-decoration:none;background:var(--primary-lt);padding:2px 8px;border-radius:20px;margin-left:auto}
.memo-box h4 a:hover{background:var(--primary);color:#fff}
.memo-current{background:#fafbff;border:1px solid #eef0f8;border-radius:7px;padding:6px 10px;margin-bottom:4px}
.memo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
@media(max-width:720px){.memo-grid{grid-template-columns:1fr}}
.memo-sec{border-radius:8px;padding:8px 10px;border:1px solid transparent}
.memo-sec-t{font-size:11px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.memo-sec-b{font-size:11.5px;color:#3a3f52;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.memo-sec-b:empty::after{content:'-';color:var(--muted)}
.memo-sec.m1{background:#fff1e8;border-color:#ffd9c2}
.memo-sec.m1 .memo-sec-t{color:#c2410c}
.memo-sec.m2{background:#fefce8;border-color:#fde68a}
.memo-sec.m2 .memo-sec-t{color:#a16207}
.memo-sec.m3{background:#eff6ff;border-color:#bfdbfe}
.memo-sec.m3 .memo-sec-t{color:#1d4ed8}
.memo-sec.m4{background:#f0fdf4;border-color:#bbf7d0}
.memo-sec.m4 .memo-sec-t{color:#15803d}
.memo-hist-toggle{font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;padding:2px 0}
.memo-hist-toggle:hover{color:var(--primary)}
.memo-list{max-height:220px;overflow-y:auto;margin-top:4px}
.memo-item{padding:7px 0;border-bottom:1px solid #f2f3f8}
.memo-item:last-child{border-bottom:none}
.memo-date{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.memo-user{color:var(--text);font-weight:700}
.memo-text{font-size:12px;color:#444a5c;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.memo-empty{padding:8px 0;text-align:center;color:var(--muted);font-size:11px;line-height:1.5}

.vtabs{display:flex;gap:0;background:#f3f4f6;border-radius:10px;padding:3px;margin-bottom:8px}
.vtab{flex:1;padding:6px 0;text-align:center;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);border:none;background:none;transition:all .2s}
.vtab.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1)}

.ss{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc{flex:1;min-width:78px;background:#fff;border-radius:9px;padding:7px;box-shadow:var(--sh);text-align:center}
.sc .n{font-size:16.5px;font-weight:800}
.sc .l{font-size:10px;color:var(--muted);margin-top:0}

/* CATEGORY / TASK TABLE */
.cat-block{background:#fff;border-radius:12px;box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.cat-hdr{display:flex;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);transition:background .12s;gap:8px}
.cat-hdr:hover{background:#f8f9ff}
.cat-arrow{font-size:11px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.cat-arrow.open{transform:rotate(90deg)}
.cat-title{font-size:13.5px;font-weight:700;flex:1}
.cat-cnt{font-size:11px;background:var(--primary-lt);color:var(--primary);padding:2px 8px;border-radius:10px}
.cat-body{display:none}
.cat-body.open{display:block}
.ttable-wrap{overflow-x:auto}
.ttable{width:100%;min-width:820px;border-collapse:collapse;font-size:12px;table-layout:fixed}
.ttable col.c-name{width:28%}
.ttable col.c-status{width:9%}
.ttable col.c-period{width:19%}
.ttable col.c-asg{width:10%}
.ttable col.c-memo{width:8%}
.ttable td, .ttable th{overflow:hidden;text-overflow:ellipsis}
.ttable td:nth-child(1){white-space:normal;word-break:break-word}
.ttable th{background:#fafbff;padding:8px 12px;text-align:left;font-weight:700;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.ttable td{padding:8px 12px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.ttable tr:last-child td{border-bottom:none}
.ttable tr:hover td{background:#fafbff}
.ttable tr.row-hold td{background:#fff5f5!important}
.spill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap}
.spill.s-done{background:var(--done)}
.spill.s-prog{background:var(--prog)}
.spill.s-plan{background:var(--plan-c)}
.spill.s-hold{background:var(--hold)}
.memo-dot{color:#d97706;font-size:11px}

/* GANTT (v6 style) */
.gw{background:#fff;border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.ghdr{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.ghdr h3{font-size:13.5px;font-weight:700}
.gctrl{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gzbtn,.gtdbtn{padding:4px 11px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:12px;cursor:pointer;color:var(--muted);font-weight:600;transition:all .15s}
.gzbtn.on{background:var(--primary-lt);border-color:var(--primary);color:var(--primary)}
.gzbtn:hover,.gtdbtn:hover{border-color:var(--primary);color:var(--primary)}
.gleg{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.gli{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text);font-weight:600;background:#f8f9ff;border:1px solid #eef0f8;padding:3px 10px 3px 8px;border-radius:20px}
.gld{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(0,0,0,.03)}
.ginner{display:flex;border-top:none}
.glabels{flex-shrink:0;width:220px;border-right:2px solid var(--border);background:#fff}
.glhdr{height:32px;background:#f8f9ff;border-bottom:2px solid var(--border);display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;color:var(--muted)}
.glrow{height:40px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 8px 0 10px;font-size:11.5px;border-bottom:1px solid #f3f4f6;overflow:hidden}
.glrow .gllabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glrow .glsub{font-size:9.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glrow.glcat{font-weight:700;color:var(--primary);background:#f5f7ff;font-size:12px;border-bottom:1px solid var(--border)}
.glrow.glcat .glsub{color:var(--primary);opacity:.65}

/* ── Obsidian · Brass skin ── */
.gw.gw-obsidian{--go-bg:#14120f;--go-surface:#1c1914;--go-surface2:#211d17;--go-ink:#efe8db;--go-muted:#9a9382;--go-accent:#c9a45c;--go-accent-soft:#8f7a4a;--go-line:#332e25;--go-line2:#443d2f;background:var(--go-bg);box-shadow:0 24px 50px -24px rgba(0,0,0,.55)}
.gw.gw-obsidian .ghdr{border-bottom-color:var(--go-line)}
.gw.gw-obsidian .ghdr h3{color:var(--go-ink);font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:.01em}
.gw.gw-obsidian .gzbtn,.gw.gw-obsidian .gtdbtn,.gw.gw-obsidian .gwkbtn{background:var(--go-surface);border-color:var(--go-line2);color:var(--go-muted)}
.gw.gw-obsidian .gzbtn.on,.gw.gw-obsidian .gwkbtn.on{background:rgba(201,164,92,.14);border-color:var(--go-accent);color:var(--go-accent)}
.gw.gw-obsidian .gzbtn:hover,.gw.gw-obsidian .gtdbtn:hover,.gw.gw-obsidian .gwkbtn:hover{border-color:var(--go-accent);color:var(--go-accent)}
.gw.gw-obsidian .gleg{border-bottom-color:var(--go-line)}
.gw.gw-obsidian .gli{background:var(--go-surface);border-color:var(--go-line2);color:var(--go-ink)}
.gw.gw-obsidian .glabels{background:var(--go-surface);border-right-color:var(--go-line)}
.gw.gw-obsidian .glhdr{background:var(--go-surface2);border-bottom-color:var(--go-line);color:var(--go-muted);font-family:'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:9.5px}
.gw.gw-obsidian .gyspacer{background:var(--go-surface2);border-bottom-color:var(--go-line)}
.gw.gw-obsidian .glrow{border-bottom-color:var(--go-line);color:var(--go-ink)}
.gw.gw-obsidian .glrow.glcat{background:var(--go-surface2);color:var(--go-accent)}
.gw.gw-obsidian .glrow.glcat .glsub{color:var(--go-accent-soft);opacity:1}
.gw.gw-obsidian .gcanvas{background:var(--go-bg)}
.gw.gw-obsidian .gchdrs,.gw.gw-obsidian .gyhdrs{background:var(--go-surface2);border-bottom-color:var(--go-line)}
.gw.gw-obsidian .gyhdr{color:var(--go-accent);border-right-color:var(--go-line)}
.gw.gw-obsidian .gchdr{color:var(--go-muted);border-right-color:var(--go-line)}
.gw.gw-obsidian .gchdr.gms{border-left-color:var(--go-line2);color:var(--go-ink)}
.gw.gw-obsidian .gchdr.gtd{background:rgba(201,164,92,.16);color:var(--go-accent)}
.gw.gw-obsidian .gchdr.gwknd{background:#181511;color:#5c5748}
.gw.gw-obsidian .grow{border-bottom-color:var(--go-line)}
.gw.gw-obsidian .grow:hover{background:rgba(201,164,92,.045)}
.gw.gw-obsidian .grow.grcat{background:var(--go-surface2)}
.gw.gw-obsidian .grow.grcat:hover{background:var(--go-surface2)}
.gw.gw-obsidian .gcell{border-right-color:var(--go-line)}
.gw.gw-obsidian .gcell.gtd{background:rgba(201,164,92,.09);border-right-color:var(--go-accent-soft)}
.gw.gw-obsidian .gcell.gwknd{background:#181511}
.gw.gw-obsidian .gtvline{background:repeating-linear-gradient(180deg,var(--go-accent) 0,var(--go-accent) 5px,transparent 5px,transparent 9px)}
.gw.gw-obsidian .gtflag{background:var(--go-accent);color:var(--go-bg);box-shadow:0 2px 8px rgba(201,164,92,.35)}
.gw.gw-obsidian .gdatelbl{color:var(--go-muted)}
.gw.gw-obsidian .gbarlbl{color:rgba(240,235,222,.95);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.gw.gw-obsidian .gbar-actual{box-shadow:0 1px 3px rgba(0,0,0,.4)}
.gw.gw-obsidian .gmilestone{background:var(--go-accent);box-shadow:0 0 0 3px rgba(201,164,92,.22),0 2px 6px rgba(0,0,0,.4)}
.gcanvas{flex:1;overflow-x:auto;position:relative}
.gcinner{position:relative}
.gchdrs{display:flex;height:32px;background:#f8f9ff;border-bottom:2px solid var(--border)}
.gyspacer{height:20px;background:#eef1fd;border-bottom:1px solid var(--border)}
.gyhdrs{height:20px;position:relative;background:#eef1fd;border-bottom:1px solid var(--border)}
.gyhdr{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--primary);border-right:1px solid #dbe0f5;white-space:nowrap;overflow:hidden}
.gchdr{flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--muted);border-right:1px solid #eee;white-space:nowrap;overflow:hidden}
.gchdr.gms{border-left:2px solid #d1d5db;font-weight:700;color:var(--text)}
.gchdr.gtd{background:#fffbeb;color:#92400e;font-weight:700}
.grow{height:40px;position:relative;border-bottom:1px solid #f3f4f6;display:flex;transition:background .12s}
.grow:hover{background:#fafbff}
.grow.grcat{background:#f5f7ff;border-bottom:1px solid var(--border)}
.grow.grcat:hover{background:#f0f2ff}
.gcell{flex-shrink:0;height:100%;border-right:1px solid #f5f5f5}
.gcell.gtd{background:#fffde7;border-right:2px solid #fcd34d}
.gchdr.gwknd{background:#f4f5f9;color:#b0b4c2}
.gcell.gwknd{background:#f8f9fb}
.gwkbtn{padding:4px 11px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:12px;cursor:pointer;color:var(--muted);font-weight:600;transition:all .15s}
.gwkbtn.on{background:var(--primary-lt);border-color:var(--primary);color:var(--primary)}
.gwkbtn:hover{border-color:var(--primary);color:var(--primary)}
.gbar{position:absolute;top:50%;transform:translateY(-50%);border-radius:5px;display:flex;align-items:center;overflow:hidden;cursor:pointer;z-index:2;min-width:4px;box-shadow:0 1px 3px rgba(30,41,59,.18)}
.gbar.gbcat{height:20px;border-radius:6px}
.gbar.gbtask{height:15px}
.gbarlbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.97);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.gtvline{position:absolute;top:0;bottom:0;width:2px;background:repeating-linear-gradient(180deg,#f59e0b 0,#f59e0b 5px,transparent 5px,transparent 9px);z-index:3;pointer-events:none}
.gtflag{position:absolute;top:0;background:#f59e0b;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:0 0 6px 6px;z-index:4;white-space:nowrap;box-shadow:0 2px 5px rgba(245,158,11,.4);letter-spacing:.3px}
.gtip{position:fixed;background:#1e293b;color:#fff;border-radius:9px;padding:10px 14px;font-size:12px;z-index:9999;pointer-events:none;display:none;line-height:1.7;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:280px}
.gtip strong{display:block;margin-bottom:2px}
.gbar-plan{position:absolute;border-radius:3px;z-index:1;pointer-events:none}
.gbar-actual{position:absolute;border-radius:3px;cursor:pointer;z-index:2;display:flex;align-items:center;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.18)}
.gbar-wip-ext{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0px,transparent 7px,rgba(255,255,255,.22) 7px,rgba(255,255,255,.22) 9px);border-radius:0 3px 3px 0;pointer-events:none;z-index:1}
.gdatelbl{position:absolute;font-size:9px;color:var(--muted);font-weight:700;white-space:nowrap;pointer-events:none;z-index:2;letter-spacing:.1px}
.gissue{position:absolute;top:1px;width:15px;height:15px;background:#ef4444;border:2px solid #fff;border-radius:50% 50% 50% 2px;box-shadow:0 1px 4px rgba(220,38,38,.5);transform:translateX(-50%) rotate(-45deg);z-index:6;cursor:pointer}
.gissue::after{content:'!';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);color:#fff;font-size:9px;font-weight:900}
.gissue:hover{filter:brightness(1.1);transform:translateX(-50%) rotate(-45deg) scale(1.15)}
.gmilestone{position:absolute;top:50%;width:13px;height:13px;background:#f59e0b;border:2px solid #fff;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:5;cursor:pointer}
.gmilestone:hover{filter:brightness(1.12)}
.gissue-cnt{position:absolute;top:-6px;right:-6px;background:#1e293b;color:#fff;font-size:8px;font-weight:800;min-width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);border:1.5px solid #fff;padding:0 2px}
.gmemo-flag{position:absolute;font-size:13px;line-height:1;z-index:6;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));transition:transform .12s}
.gmemo-flag:hover{transform:scale(1.25)}

/* STORY */
.story-feed{background:#fff;border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.story-date-hdr{padding:10px 18px;background:#f5f7ff;border-bottom:1px solid #e0e7ff;font-size:11.5px;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:8px}
.story-date-hdr .cnt{background:#fff;color:var(--primary);padding:1px 8px;border-radius:10px;font-size:10px;border:1px solid #c7d2fe}
.story-item{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid #f2f3f8;transition:background .12s}
.story-item:hover{background:#fafbff}
.story-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.story-content{flex:1;min-width:0}
.story-top{display:flex;gap:10px;align-items:center;margin-bottom:2px;flex-wrap:wrap}
.story-user{font-size:12px;font-weight:800;color:var(--text)}
.story-time{font-size:10.5px;color:var(--muted);margin-left:auto}
.story-msg{font-size:12.5px;color:#444a5c}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;background:#fff;border-radius:14px}

@media (max-width: 900px){
  .main{flex-direction:column}
  .plist{width:100%;max-height:280px;border-right:none;border-bottom:1px solid var(--border)}
  .dp{max-height:none}
  .mgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>📊 아리비앤씨 프로젝트 관리</h1>
    <p>Projects / Tasks / Changes 시트 실시간 연동 · <span class="status-line" id="status">불러오는 중...</span></p>
  </div>
  <button class="hdr-btn" onclick="loadData()">🔄 새로고침</button>
  <div class="hdr-stats">
    <div class="hs"><div class="n" id="hc-total">0</div><div class="l">전체</div></div>
    <div class="hs"><div class="n" id="hc-prog">0</div><div class="l">진행 중</div></div>
    <div class="hs"><div class="n" id="hc-done">0</div><div class="l">완료</div></div>
    <div class="hs"><div class="n" id="hc-hold" style="color:#fca5a5">0</div><div class="l">🔴 홀딩</div></div>
  </div>
</div>

<div class="nav">
  <input type="text" id="srch" placeholder="🔍 프로젝트명, 의뢰사, 기능성, PI 검색..." oninput="onSearch(this.value)">
  <div id="filter-pills"></div>
</div>

<div class="main">
  <div class="plist" id="plist"><div class="no-res">불러오는 중...</div></div>
  <div class="dp empty" id="dp">
    <div class="ei">📁</div>
    <p style="font-size:14px;font-weight:700;margin-bottom:6px">프로젝트를 선택하세요</p>
    <p style="font-size:12px">왼쪽 목록에서 클릭하면 업무 목록·간트차트·스토리보드를 볼 수 있습니다</p>
  </div>
</div>

<script>
// 이전(캐시 없는) 배포 — 문제 생기면 아래 줄 주석 풀고 새 URL 줄을 주석 처리해서 되돌리면 됨
// const GANTT_API_URL = 'https://script.google.com/macros/s/AKfycbztyPjoPThGHol6ofbfl81eoCOKlE7UxjzwWV-tuFH67hSKYOHzkuOhqD2EH62WC8jS/exec';
const GANTT_API_URL = 'https://script.google.com/macros/s/AKfycbySVcEpCzpRrvQzHb-Q3XjmmVb-pdjz6AgHCCn-MWl7f4gdbMYHknEAwczxMkDTRsxKaQ/exec';
const APPSHEET_URL = 'https://www.appsheet.com/start/ae92652b-e796-480b-8cfa-bbb20f0e9115';

let RAW = { projects: [], tasks: [], changes: [] };
let curFilter = '전체';
let srchQ = '';
let selId = null;
let curView = 'task';
let gZoom = 'month';
let hideWeekend = false;
let dpCollapsed = false;
const GCW = { week:24, month:38, quarter:58 };
const GCOL = { '완료':'#10b981', '진행중':'#f59e0b', '진행 중':'#f59e0b', '예정':'#818cf8', '종료':'#9ca3af', '홀딩':'#dc2626', '':'#d1d5db' };
const GGRAD = {
  '완료':'linear-gradient(150deg,#5eead4 0%,#10b981 55%,#047857 100%)',
  '진행중':'linear-gradient(150deg,#fcd34d 0%,#f59e0b 55%,#b45309 100%)',
  '진행 중':'linear-gradient(150deg,#fcd34d 0%,#f59e0b 55%,#b45309 100%)',
  '예정':'linear-gradient(150deg,#c7d2fe 0%,#818cf8 55%,#4338ca 100%)',
  '종료':'linear-gradient(150deg,#e5e7eb 0%,#9ca3af 55%,#4b5563 100%)',
  '홀딩':'repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px),linear-gradient(150deg,#fca5a5 0%,#dc2626 55%,#991b1b 100%)',
  '연체':'linear-gradient(150deg,#fca5a5 0%,#ef4444 55%,#b91c1c 100%)',
  '':'linear-gradient(150deg,#e5e7eb 0%,#d1d5db 55%,#9ca3af 100%)'
};
const GPALE = {
  '완료':'#d1f5e8', '진행중':'#fdead0', '진행 중':'#fdead0', '예정':'#e2e5fc',
  '종료':'#ececee', '홀딩':'#fbdcdc', '연체':'#fbdcdc', '':'#eceef2'
};
/* 옵시디언 스킨용 팔레트 — 입체감 없는 플랫 컬러, 절제된 톤 */
const GGRAD_OB = {
  '완료':'#6d8f80',
  '진행중':'#b8935a',
  '진행 중':'#b8935a',
  '예정':'#5c6c82',
  '종료':'#8a8272',
  '홀딩':'#8c5352',
  '연체':'#a8624f',
  '':'#6b6558'
};
/* plan(예상) 밴드는 border 없이 은은한 반투명 유령 막대로만 표시 */
const GPALE_OB = {
  '완료':'rgba(109,143,128,.30)', '진행중':'rgba(184,147,90,.30)', '진행 중':'rgba(184,147,90,.30)',
  '예정':'rgba(92,108,130,.32)', '종료':'rgba(138,130,114,.28)', '홀딩':'rgba(140,83,82,.30)',
  '연체':'rgba(168,98,79,.30)', '':'rgba(107,101,88,.28)'
};
let ganttSkin = 'obsidian';
function gGrad(st){ return ganttSkin==='obsidian' ? (GGRAD_OB[st]||GGRAD_OB['']) : (GGRAD[st]||GGRAD['']); }
function gPale(st){ return ganttSkin==='obsidian' ? (GPALE_OB[st]||GPALE_OB['']) : (GPALE[st]||GPALE['']); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── DATA LOAD ── */
async function loadData(){
  const st = document.getElementById('status');
  st.textContent = '불러오는 중...';
  st.classList.remove('err');
  try{
    const res = await fetch(GANTT_API_URL);
    const json = await res.json();
    RAW.projects = json.projects || [];
    RAW.tasks = json.tasks || [];
    RAW.changes = json.changes || [];
    renderFilterPills();
    renderPlist();
    updateHeaderStats();
    if(selId && RAW.projects.some(p=>p['ID']===selId)) renderDetail(selId);
    else if(selId){ selId=null; showEmptyDetail(); }
    st.textContent = `✅ ${new Date().toLocaleTimeString('ko-KR')} 업데이트 · 프로젝트 ${RAW.projects.length}개 · 업무 ${RAW.tasks.length}개`;
  }catch(e){
    st.textContent = '⚠️ 데이터를 불러오지 못했습니다';
    st.classList.add('err');
    console.error(e);
  }
}

function isHold(t){ return t['홀딩']==='TRUE'||t['홀딩']===true; }
function isDone(t){ return t['상태']==='완료'||t['상태']==='종료'; }
function isProg(t){ return t['상태']==='진행 중'||t['상태']==='진행중'; }
function statusCls(t){ if(isHold(t)) return 's-hold'; if(isDone(t)) return 's-done'; if(isProg(t)) return 's-prog'; return 's-plan'; }
function statusLabel(t){ if(isHold(t)) return '홀딩'; return t['상태']||'예정'; }
function projTasks(pid){ return RAW.tasks.filter(t=>t['프로젝트ID']===pid); }
function rate(pid){
  const tasks = projTasks(pid);
  if(!tasks.length) return 0;
  const done = tasks.filter(isDone).length;
  return Math.round(done/tasks.length*100);
}
function projName(id){ const p = RAW.projects.find(x=>x['ID']===id); return p ? p['프로젝트명'] : id; }

/* ── HEADER STATS ── */
function updateHeaderStats(){
  document.getElementById('hc-total').textContent = RAW.tasks.length;
  document.getElementById('hc-prog').textContent = RAW.tasks.filter(isProg).length;
  document.getElementById('hc-done').textContent = RAW.tasks.filter(isDone).length;
  document.getElementById('hc-hold').textContent = RAW.tasks.filter(isHold).length;
}

/* ── FILTER PILLS ── */
function renderFilterPills(){
  const cats = [...new Set(RAW.projects.map(p=>p['분류']).filter(Boolean))];
  const el = document.getElementById('filter-pills');
  el.innerHTML = `<button class="fb${curFilter==='전체'?' on':''}" onclick="setFilter('전체')">전체</button>` +
    cats.map(c=>`<button class="fb${curFilter===c?' on':''}" onclick="setFilter('${esc(c)}')">${esc(c)}</button>`).join('') +
    `<button class="fb${curFilter==='홀딩'?' on':''}" style="border-color:#fca5a5;color:#dc2626" onclick="setFilter('홀딩')">🔴 홀딩중</button>`;
}
function setFilter(f){ curFilter=f; renderFilterPills(); renderPlist(); }
function onSearch(v){ srchQ = v.trim().toLowerCase(); renderPlist(); }

function getFilteredProjects(){
  return RAW.projects.filter(p=>{
    if(curFilter==='홀딩'){ if(!projTasks(p['ID']).some(isHold)) return false; }
    else if(curFilter!=='전체' && p['분류']!==curFilter) return false;
    if(srchQ){
      const hay = [p['프로젝트명'],p['의뢰사'],p['기능성'],p['PI'],p['실시기관']].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(srchQ)) return false;
    }
    return true;
  });
}

/* ── PROJECT LIST ── */
function renderPlist(){
  const el = document.getElementById('plist');
  const list = getFilteredProjects();
  if(!list.length){ el.innerHTML = '<div class="no-res">조건에 맞는 프로젝트가 없습니다</div>'; return; }
  el.innerHTML = list.map(p=>{
    const pid = p['ID'];
    const tasks = projTasks(pid);
    const r = rate(pid);
    const progCnt = tasks.filter(isProg).length;
    const holdCnt = tasks.filter(isHold).length;
    return `<div class="pc${selId===pid?' on':''}${holdCnt>0?' hold-proj':''}" onclick="selectProj('${esc(pid)}')">
      <div class="pid">${esc(pid)}</div>
      <span class="tbadge">${esc(p['분류']||'-')}</span>
      <div class="pname">${esc(p['프로젝트명'])}</div>
      <div class="pfunc">✦ ${esc(p['기능성']||'-')}</div>
      <div class="pmeta">
        <span>👤 ${esc(p['PI']||'-')}</span><span>🏢 ${esc(p['의뢰사']||'-')}</span>
        ${progCnt>0?`<span style="color:#f59e0b;font-weight:700">● 진행 ${progCnt}</span>`:''}
        ${holdCnt>0?`<span style="color:var(--hold);font-weight:700">🔴 ${holdCnt}</span>`:''}
      </div>
      <div class="pbar"><div class="pfill" style="width:${r}%"></div></div>
      <div style="font-size:10px;color:var(--muted);margin-top:3px">${r}% 완료 · ${tasks.length}건</div>
    </div>`;
  }).join('');
}

function showEmptyDetail(){
  const dp = document.getElementById('dp');
  dp.className = 'dp empty';
  dp.innerHTML = `<div class="ei">📁</div>
    <p style="font-size:14px;font-weight:700;margin-bottom:6px">프로젝트를 선택하세요</p>
    <p style="font-size:12px">왼쪽 목록에서 클릭하면 업무 목록·간트차트·스토리보드를 볼 수 있습니다</p>`;
}

function selectProj(pid){ selId=pid; curView='task'; renderPlist(); renderDetail(pid); }

/* ── DETAIL ── */
function renderDetail(pid){
  const p = RAW.projects.find(x=>x['ID']===pid);
  if(!p){ showEmptyDetail(); return; }
  const tasks = projTasks(pid);
  const done = tasks.filter(isDone).length;
  const prog = tasks.filter(isProg).length;
  const hold = tasks.filter(isHold).length;
  const plan = tasks.length - done - prog - hold;
  const r = rate(pid);

  const dp = document.getElementById('dp');
  dp.className = 'dp';
  dp.innerHTML = `
    <div class="dp-sticky">
    <div class="dp-stick-bar${dpCollapsed?' show':''}" id="dp-stick-bar" onclick="toggleDpSticky()">
      <span class="dp-stick-name">${esc(p['프로젝트명'])}<span class="dp-stick-id">${esc(pid)}</span></span>
      <span class="dp-stick-toggle">▼ 펼치기</span>
    </div>
    <div class="dp-collapsible" id="dp-collapsible" style="display:${dpCollapsed?'none':'block'}">
    <div class="dh">
      <div class="dh-top">
        <div>
          <div style="font-size:11px;color:var(--muted);font-family:monospace;margin-bottom:2px">${esc(pid)}</div>
          <h2>${esc(p['프로젝트명'])}</h2>
          <span class="ftag">✦ ${esc(p['기능성']||'-')}</span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="text-align:right">
            <div style="font-size:19px;font-weight:800;color:var(--primary);line-height:1.1">${r}%</div>
            <div style="font-size:9.5px;color:var(--muted)">완료율</div>
            <div style="margin-top:3px;width:80px;height:4px;background:var(--border);border-radius:3px">
              <div style="width:${r}%;height:100%;background:var(--done);border-radius:3px"></div>
            </div>
          </div>
          <span class="dp-stick-toggle dp-collapse-btn" onclick="toggleDpSticky(event)" title="프로젝트 정보·메모 접기">▲ 접기</span>
        </div>
      </div>
      <div class="mgrid">
        <div class="mi"><label>P/I</label><span>${esc(p['PI']||'-')}</span></div>
        <div class="mi"><label>의뢰사</label><span>${esc(p['의뢰사']||'-')}</span></div>
        <div class="mi"><label>실시기관</label><span>${esc(p['실시기관']||'-')}</span></div>
        <div class="mi"><label>분류</label><span>${esc(p['분류']||'-')}</span></div>
        <div class="mi"><label>시작일 ~ 목표종료일</label><span>${p['시작일']?dOnly(p['시작일']):'-'} ~ ${p['목표종료일']?dOnly(p['목표종료일']):'-'}</span></div>
        <div class="mi"><label>전체 업무</label><span>${tasks.length}건</span></div>
        <div class="mi"><label>📄 계약기간</label><span>${esc(p['계약기간(계약서)']||p['계약기간']||'-')}</span></div>
        <div class="mi wide"><label>💰 비용지급조건</label><span>${esc(p['비용지급조건(계약서)']||p['비용지급조건']||'-')}</span></div>
      </div>
    </div>
    <div class="memo-box">
      <h4>📋 프로젝트 메모<a href="${APPSHEET_URL}" target="_blank" rel="noopener">📱 AppSheet에서 수정</a></h4>
      <div class="memo-current" id="memo-current"></div>
      <div class="memo-hist-toggle" id="memo-hist-toggle" onclick="toggleMemoHist()">🕘 변경 이력 <span id="memo-hist-arrow">▶</span></div>
      <div class="memo-list" id="memo-list" style="display:none"></div>
    </div>
    </div>
    <div class="vtabs">
      <button class="vtab${curView==='task'?' on':''}" onclick="switchView('task')">📋 업무 목록</button>
      <button class="vtab${curView==='gantt'?' on':''}" onclick="switchView('gantt')">📊 간트차트</button>
      <button class="vtab${curView==='story'?' on':''}" onclick="switchView('story')">📖 스토리보드</button>
    </div>
    <div class="ss">
      <div class="sc"><div class="n" style="color:var(--done)">${done}</div><div class="l">✅ 완료</div></div>
      <div class="sc"><div class="n" style="color:#f59e0b">${prog}</div><div class="l">⏳ 진행</div></div>
      <div class="sc"><div class="n" style="color:#6366f1">${plan}</div><div class="l">📅 예정</div></div>
      ${hold>0?`<div class="sc"><div class="n" style="color:var(--hold)">${hold}</div><div class="l">🔴 홀딩</div></div>`:''}
    </div>
    </div>
    <div id="vtask"></div>
    <div id="vgantt"></div>
    <div id="vstory"></div>
  `;
  renderProjMemos(pid);
  applyView(curView);
}

function ganttShellHtml(){
  return `<div class="gw gw-obsidian" id="gw-wrap">
    <div class="ghdr">
      <h3>📊 간트차트</h3>
      <div class="gctrl">
        <button class="gzbtn${gZoom==='month'?' on':''}" id="gz-month" onclick="setGZ('month')">월</button>
        <button class="gzbtn${gZoom==='week'?' on':''}" id="gz-week" onclick="setGZ('week')">주</button>
        <button class="gzbtn${gZoom==='quarter'?' on':''}" id="gz-quarter" onclick="setGZ('quarter')">분기</button>
        <button class="gwkbtn${hideWeekend?' on':''}" id="gz-wknd" onclick="toggleWeekend()" title="'주' 보기에서 토·일 칸을 숨겨서 타임라인을 압축합니다">주말 숨기기</button>
        <button class="gtdbtn" onclick="gToday()">오늘 ⊙</button>
      </div>
    </div>
    <div class="gleg">
      <div class="gli"><div class="gld" style="background:#10b981"></div>완료</div>
      <div class="gli"><div class="gld" style="background:#f59e0b"></div>진행 중</div>
      <div class="gli"><div class="gld" style="background:#818cf8"></div>예정</div>
      <div class="gli"><div class="gld" style="background:#dc2626"></div>홀딩</div>
      <div class="gli">🚩 이슈 발생 (마우스 오버로 내용 확인)</div>
    </div>
    <div id="gc"></div>
  </div><div class="gtip" id="gtip"></div>`;
}

function applyView(v){
  const vtask=document.getElementById('vtask'), vgantt=document.getElementById('vgantt'), vstory=document.getElementById('vstory');
  if(!vtask) return;
  vtask.innerHTML=''; vgantt.innerHTML=''; vstory.innerHTML='';
  if(v==='task'){ vtask.innerHTML = buildTaskView(selId); }
  else if(v==='gantt'){ vgantt.innerHTML = ganttShellHtml(); setTimeout(()=>drawGantt(selId),30); }
  else if(v==='story'){ vstory.innerHTML = buildStoryView(selId); }
}

function switchView(v){
  curView = v;
  document.querySelectorAll('.vtab').forEach((el,i)=>el.classList.toggle('on', ['task','gantt','story'][i]===v));
  applyView(v);
}

/* ── TASK LIST VIEW ── */
function buildTaskView(pid){
  const tasks = projTasks(pid);
  const groups = {};
  tasks.forEach(t=>{ const g = t['분류[업무그룹]']||'기타'; (groups[g]=groups[g]||[]).push(t); });
  return Object.entries(groups).map(([gname,gtasks],gi)=>{
    const doneCnt = gtasks.filter(isDone).length;
    const rowId = `cat-${gi}`;
    const rows = gtasks.map(t=>{
      const hasMemo = (t['메모']||'').trim();
      return `<tr class="${isHold(t)?'row-hold':''}">
        <td>${esc(t['업무명'])}</td>

  }).join('') || '<div class="empty">등록된 업무가 없습니다</div>';

/* ── MEMOS (project detail box) ── */
function isMemo(c){ return (c['변경내용']||'').trim().startsWith('메모'); }
function isIssue(c){ return (c['변경내용']||'').trim().startsWith('이슈'); }
/* 업무별 이슈 목록: Changes 시트에서 같은 프로젝트+업무명, 변경내용이 "이슈"로 시작하는 항목을 모두 모음(날짜별 여러 건 가능).
   구버전 호환: Tasks 시트의 이슈일자/이슈내용 단일 필드도 있으면 함께 포함. */
function taskIssues(pid, t){
  const pname = projName(pid);
  const tname = t['업무명'];
  const out = [];
  (RAW.changes||[]).forEach(c=>{
    if(!isIssue(c)) return;
    if((c['프로젝트']||'')!==pname && (c['프로젝트']||'')!==pid) return;
    if((c['업무']||'')!==tname) return;
    const d = parseDateFlexible(c['시각']);
    if(!d) return;
    out.push({ date: gpd(d.toISOString()), note: (c['변경내용']||'').replace(/^이슈\s*:?\s*/,'') });
  });
  if(t['이슈일자']){
    const ld = gpd(t['이슈일자']);
    if(ld) out.push({ date: ld, note: t['이슈내용']||'' });
  }
  return out;
}

/* ── STORY VIEW (per project) ── */
function feedColor(msg){
  msg = msg || '';
  if(msg.includes('상태')) return 'var(--primary)';
  if(msg.includes('홀딩')) return 'var(--hold)';
  if(msg.includes('날짜')||msg.includes('기간')||msg.includes('예상')||msg.includes('실제')) return 'var(--prog)';
  if(msg.includes('메모')) return 'var(--done)';
  if(msg.includes('추가')) return '#6366f1';
  if(msg.includes('삭제')) return '#ef4444';
  return 'var(--muted)';
}
function buildStoryView(pid){
  const pname = projName(pid);
  let changes = (RAW.changes||[]).filter(c => (c['프로젝트']||'')===pname || (c['프로젝트']||'')===pid);
  changes.sort((a,b)=>{ const da=parseDateFlexible(a['시각']), db=parseDateFlexible(b['시각']); return (db?db.getTime():0)-(da?da.getTime():0); });
  if(!changes.length) return '<div class="empty">변경 이력이 없습니다</div>';
  const groups = [];
  let curKey = null;
  changes.slice(0,300).forEach(c=>{
    const label = dateGroupLabel(c['시각']);
    if(label !== curKey){ curKey = label; groups.push({label, items:[]}); }
    groups[groups.length-1].items.push(c);
  });
  return `<div class="story-feed">` + groups.map(g=>{
    return `<div class="story-date-hdr">${esc(g.label)} <span class="cnt">${g.items.length}건</span></div>` +
      g.items.map(c=>{
        const color = feedColor(c['변경내용']);
        let timeStr = String(c['시각']||'');
        const tm = timeStr.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/);
        const short = tm ? (tm[1]||'')+' '+tm[2]+':'+tm[3] : '';
        return `<div class="story-item">
          <div class="story-dot" style="background:${color}"></div>
          <div class="story-content">
            <div class="story-top">
              <span class="story-user">${esc(c['사용자']||'알 수 없음')}</span>
              <span class="story-time">${esc(short)}</span>
            </div>
            <div class="story-msg">${esc(c['업무']?('['+c['업무']+'] '):'')}${esc(c['변경내용']||'')}</div>
          </div>
        </div>`;
      }).join('');
  }).join('') + `</div>`;
}

function dateGroupLabel(str){
  const d = parseDateFlexible(str);
  if(!d) return '날짜 미상';
  const today = new Date(); today.setHours(0,0,0,0);
  const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
  const diff = Math.round((today-dOnly)/86400000);
  const mo = d.getMonth()+1, da = d.getDate();
  if(diff===0) return `🔵 오늘 (${mo}월 ${da}일)`;
  if(diff===1) return `어제 (${mo}월 ${da}일)`;
  if(diff>=0 && diff<=7) return `${diff}일 전 (${mo}월 ${da}일)`;
  return `${d.getFullYear()}년 ${mo}월 ${da}일`;
}
function parseDateFlexible(str){
  if(!str) return null;
  let s = String(str).trim();
  const isPM = s.includes('오후'), isAM = s.includes('오전');
  s = s.replace(/오전\s*/g,'').replace(/오후\s*/g,'');
  const m = s.match(/(\d{4})[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})\.?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m){
    let h=+m[4]; if(isPM && h<12) h+=12; if(isAM && h===12) h=0;
    return new Date(+m[1], +m[2]-1, +m[3], h, +m[5], +(m[6]||0));
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* ── GANTT (v6-style dual-panel synced chart) ── */
function gpd(s){ if(!s) return null; const d=new Date(s); d.setHours(0,0,0,0); return isNaN(d.getTime())?null:d; }
function dOnly(s){ const d=gpd(s); return d?gds(d):(s||''); }
function gds(d){ return d?d.toISOString().slice(0,10):''; }
function gdshort(d){ return d?`${d.getMonth()+1}/${d.getDate()}`:'?'; }
function gfm(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
function gfq(d){ return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1); }
function gam(d,n){ const r=new Date(d); r.setMonth(r.getMonth()+n); return r; }
function gad(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function gCols(minD,maxD,z,hideWknd){
  const cols=[];
  let c=z==='week'?new Date(minD):z==='month'?gfm(minD):gfq(minD);
  while(c<=maxD){
    const skip = z==='week' && hideWknd && (c.getDay()===0||c.getDay()===6);
    if(!skip) cols.push(new Date(c));
    if(z==='week') c=gad(c,1); else if(z==='month') c=gam(c,1); else c=gam(c,3);
  }
  return cols;
}
function gci(cols,d){ if(!d) return -1; for(let i=cols.length-1;i>=0;i--){ if(d>=cols[i]) return i; } return 0; }

function drawGantt(pid){
  const gc = document.getElementById('gc');
  if(!gc) return;
  const tasks = projTasks(pid);
  const today = new Date(); today.setHours(0,0,0,0);
  let cw = GCW[gZoom];

  const groups = {};
  tasks.forEach(t=>{ const g = t['분류[업무그룹]']||'기타'; (groups[g]=groups[g]||[]).push(t); });

  const rows = [];
  Object.entries(groups).forEach(([gname,gtasks])=>{
    let mn=null,mx=null;
    gtasks.forEach(t=>{
      [gpd(t['예상시작']),gpd(t['예상종료']),gpd(t['실제시작']),gpd(t['실제종료'])].forEach(d=>{
        if(d){ if(!mn||d<mn) mn=d; if(!mx||d>mx) mx=d; }
      });
    });
    rows.push({k:'cat', lb:gname, s:mn, e:mx});
    gtasks.forEach(t=>rows.push({
      k:'task', lb:t['업무명'],
      ps:gpd(t['예상시작']), pe:gpd(t['예상종료']),
      as2:gpd(t['실제시작']), ae2:gpd(t['실제종료']),
      st: isHold(t)?'홀딩':(t['상태']||''), asg:t['담당자']||'-',
      issues: taskIssues(pid, t),
      memo: (t['메모']||'').trim()
    }));
  });

  const dated = rows.filter(r=>r.s||r.e||r.ps||r.pe||r.as2||r.ae2);
  if(!dated.length){ gc.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted);font-size:13px">날짜가 입력된 업무가 없습니다</div>'; return; }
  const allD = dated.flatMap(r=>[r.s,r.e,r.ps,r.pe,r.as2,r.ae2]).filter(Boolean);
  let mn=new Date(Math.min(...allD)), mx=new Date(Math.max(...allD));
  if(gZoom==='week'){ mn=gad(mn,-14); mx=gad(mx,21); }
  else if(gZoom==='month'){ mn=gfm(gam(mn,-1)); mx=gam(gfm(mx),2); }
  else{ mn=gfq(gam(mn,-3)); mx=gam(gfq(mx),6); }

  const cols = gCols(mn,mx,gZoom,hideWeekend);
  if(cols.length>0){
    const availW = Math.max(0, gc.clientWidth - 220);
    const natural = cols.length*cw;
    if(natural < availW) cw = availW/cols.length;
  }
  const tw = cols.length*cw;
  const ti = gci(cols,today);

  let hh='', pm=-1;
  cols.forEach((c,i)=>{
    const isTd = i===ti;
    let lb='';
    const isWknd = gZoom==='week' && (c.getDay()===0||c.getDay()===6);
    if(gZoom==='week'){ lb = (c.getDate()===1||i===0) ? `${c.getMonth()+1}/${c.getDate()}` : `${c.getDate()}`; }
    else if(gZoom==='month'){ if(c.getMonth()!==pm){ lb = `${c.getFullYear()}.${String(c.getMonth()+1).padStart(2,'0')}`; pm=c.getMonth(); } }
    else{ if(c.getMonth()%3===0 && c.getMonth()!==pm){ lb = `${c.getFullYear()} Q${Math.floor(c.getMonth()/3)+1}`; pm=c.getMonth(); } }
    const isMS = gZoom!=='month' && (c.getDate()===1);
    hh += `<div class="gchdr${isMS?' gms':''}${isTd?' gtd':''}${isWknd?' gwknd':''}" style="width:${cw}px;min-width:${cw}px">${lb}</div>`;
  });

  let yh='';
  { let i=0;
    while(i<cols.length){
      const yr = cols[i].getFullYear();
      let j=i; while(j<cols.length && cols[j].getFullYear()===yr) j++;
      yh += `<div class="gyhdr" style="left:${i*cw}px;width:${(j-i)*cw}px">${yr}년</div>`;
      i=j;
    }
  }

  let lh='', rh='';
  rows.forEach(row=>{
    const isCat = row.k==='cat';
    const subS = isCat ? row.s : (row.ps||row.as2);
    const subE = isCat ? row.e : (row.pe||row.ae2);
    let subLine = '';
    if(subS){
      const durDays = subE ? Math.max(1, Math.round((subE-subS)/86400000)+1) : null;
      subLine = `<span class="glsub">${gdshort(subS)}${durDays?` · ${durDays}일`:''}</span>`;
    }
    lh += `<div class="glrow${isCat?' glcat':''}" title="${esc(row.lb)}"><span class="gllabel">${esc(row.lb)}</span>${subLine}</div>`;
    let cells='';
    cols.forEach((c,i)=>{
      const isWknd = gZoom==='week' && (c.getDay()===0||c.getDay()===6);
      cells+=`<div class="gcell${i===ti?' gtd':''}${isWknd?' gwknd':''}" style="width:${cw}px;min-width:${cw}px"></div>`;
    });
    let bar='';
    if(isCat){
      if(row.s && row.e){
        const si=Math.max(0,gci(cols,row.s)), ei=Math.min(cols.length-1,gci(cols,row.e));
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const catBg = ganttSkin==='obsidian' ? '#4a4436' : 'linear-gradient(90deg,#2947c4,#6366f1)';
        bar = `<div class="gbar gbcat" style="left:${left}px;width:${width}px;background:${catBg}"><span class="gbarlbl">${esc(row.lb)}</span></div>`;
      }
    } else {
      const lb = row.lb.length>22 ? row.lb.slice(0,20)+'…' : row.lb;
      const rowH = 40;
      /* 예상(plan)·실제(actual) 밴드를 동일 위치·동일 두께로 겹치게: actual이 plan 위에 그려져
         실제 진행된 구간은 actual 색이, 아직 실제가 없는 구간은 plan의 옅은 유령색이 비쳐 보임 */
      const BT=0.30, BH=0.32;
      const LBL_HI = rowH*0.02, LBL_LO = rowH*0.94; // 라벨은 밴드 위/아래로 살짝 띄워 겹침 방지
      let planBar='';
      if(row.ps && row.pe){
        const si=Math.max(0,gci(cols,row.ps)), ei=Math.min(cols.length-1,gci(cols,row.pe));
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const paleKey = row.st==='홀딩' ? '홀딩' : (row.st||'');
        planBar = `<div class="gbar-plan" style="top:${rowH*BT}px;height:${rowH*BH}px;left:${left}px;width:${width}px;background:${gPale(paleKey)}"></div>`;
        if(row.as2){
          planBar += `<span class="gdatelbl" style="left:${left+width+5}px;top:${LBL_HI}px">예상 ${gdshort(row.ps)}~${gdshort(row.pe)}</span>`;
        }
      }
      let actBar='';
      if(row.as2 && row.ae2){
        const si=Math.max(0,gci(cols,row.as2)), ei=Math.min(cols.length-1,gci(cols,row.ae2));
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const tipStr = `data-tip="${esc(row.lb)}|예상:${gds(row.ps)||'?'}~${gds(row.pe)||'?'} / 실제:${gds(row.as2)}~${gds(row.ae2)}|${row.st||'미정'}|${row.asg}"`;
        actBar = `<div class="gbar-actual gbtask" style="top:${rowH*BT}px;height:${rowH*BH}px;left:${left}px;width:${width}px;background:${gGrad(row.st)}" ${tipStr}><span class="gbarlbl">${row.st==='홀딩'?'🔴 ':''}${lb}</span></div>`;
        actBar += `<span class="gdatelbl" style="left:${left+width+5}px;top:${LBL_LO}px">실제 ${gdshort(row.as2)}~${gdshort(row.ae2)}</span>`;
      } else if(row.as2 && !row.ae2){
        const si=Math.max(0,gci(cols,row.as2));
        const todayI = gci(cols,today);
        const ei=Math.min(cols.length-1,todayI);
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const isOverdue = row.pe && today>row.pe;
        const stKey = row.st==='홀딩' ? '홀딩' : (isOverdue ? '연체' : (row.st||'진행중'));
        let wipExt='';
        if(row.pe && !isOverdue){
          const extSi=todayI, extEi=Math.min(cols.length-1,gci(cols,row.pe));
          const extW=Math.max((extEi-extSi+1)*cw-2,0);
          if(extW>0) wipExt = `<div class="gbar-wip-ext" style="top:${rowH*BT}px;height:${rowH*BH}px;left:${extSi*cw}px;width:${extW}px;background:${gGrad(stKey)}"></div>`;
        }
        const overdueStr = isOverdue ? ` 🔴+${Math.round((today-row.pe)/86400000)}일 초과` : '';
        const tipStr = `data-tip="${esc(row.lb)}|진행중: ${gds(row.as2)}~오늘${overdueStr}|${row.st||'미정'}|${row.asg}"`;
        actBar = `<div class="gbar-actual gbtask" style="top:${rowH*BT}px;height:${rowH*BH}px;left:${left}px;width:${width}px;background:${gGrad(stKey)}" ${tipStr}><span class="gbarlbl">⏳ ${lb}</span></div>${wipExt}`;
        actBar += `<span class="gdatelbl" style="left:${left+width+5}px;top:${LBL_LO}px">실제 ${gdshort(row.as2)}~진행중</span>`;
      } else if(row.ps && row.pe){
        const si=Math.max(0,gci(cols,row.ps)), ei=Math.min(cols.length-1,gci(cols,row.pe));
        const left=si*cw+2, width=Math.max((ei-si+1)*cw-4,6);
        const isOverdue = today>row.pe;
        const stKey = row.st==='홀딩' ? '홀딩' : (isOverdue ? '연체' : (row.st||'예정'));
        const tipStr = `data-tip="${esc(row.lb)}|예상:${gds(row.ps)}~${gds(row.pe)}${isOverdue&&row.st!=='홀딩'?' 🔴미시작 초과':''}|${row.st||'미정'}|${row.asg}"`;
        actBar = `<div class="gbar-actual gbtask" style="top:${rowH*BT}px;height:${rowH*BH}px;left:${left}px;width:${width}px;background:${gGrad(stKey)};opacity:${row.st==='홀딩'?1:(isOverdue?1:.85)}" ${tipStr}><span class="gbarlbl">${row.st==='홀딩'?'🔴 ':''}${lb}</span></div>`;
        actBar += `<span class="gdatelbl" style="left:${left+width+5}px;top:${LBL_LO}px">예정 ${gdshort(row.ps)}~${gdshort(row.pe)}</span>`;
      }
      let issueMark = '';
      if(row.issues && row.issues.length){
        const byDate = {};
        row.issues.forEach(iss=>{
          const key = gds(iss.date);
          (byDate[key]=byDate[key]||[]).push(iss);
        });
        Object.entries(byDate).forEach(([dkey,list])=>{
          const ii = gci(cols, list[0].date);
          if(ii>=0){
            const ix = ii*cw + cw/2;
            const noteJoined = list.map(x=>esc(x.note||'상세 내용 없음')).join(' / ');
            const issTip = `${dkey}|${esc(row.lb)}|${noteJoined}${list.length>1?` (${list.length}건)`:''}`;
            const badge = list.length>1 ? `<span class="gissue-cnt">${list.length}</span>` : '';
            issueMark += `<div class="gissue" style="left:${ix}px" data-issue="${issTip}">${badge}</div>`;
          }
        });
      }
      let memoMark = '';
      if(row.memo){
        const endDate = row.ae2 || row.pe || row.as2 || row.ps;
        if(endDate){
          const ei2 = Math.min(cols.length-1, gci(cols, endDate));
          if(ei2>=0){
            const mx = ei2*cw + cw - 6;
            const memoTip = `${esc(row.lb)}|${esc(row.memo)}`;
            memoMark = `<div class="gmemo-flag" style="left:${mx}px;top:${rowH*0.02}px" data-memo="${memoTip}">🚩</div>`;
          }
        }
      }
      let milestoneMark = '';
      if(row.ps && row.pe && row.ps.getTime()===row.pe.getTime() && !row.as2){
        const mi = gci(cols, row.ps);
        if(mi>=0){
          const mx = mi*cw + cw/2;
          const msTip = `data-tip="${esc(row.lb)}|마일스톤: ${gds(row.ps)}|${row.st||'미정'}|${row.asg}"`;
          milestoneMark = `<div class="gmilestone" style="left:${mx}px" ${msTip}></div>`;
        }
      }
      bar = planBar+actBar+issueMark+memoMark+milestoneMark;
    }
    rh += `<div class="grow${isCat?' grcat':''}" style="width:${tw}px"><div style="position:absolute;inset:0;display:flex">${cells}</div>${bar}</div>`;
  });

  const tl = ti>=0 ? ti*cw+cw/2-1 : -9999;
  gc.innerHTML = `<div class="ginner">
    <div class="glabels"><div class="gyspacer"></div><div class="glhdr">업무</div>${lh}</div>
    <div class="gcanvas" id="gcv">
      <div class="gcinner" style="width:${tw}px">
        <div class="gyhdrs" style="width:${tw}px">${yh}</div>
        <div class="gchdrs" style="width:${tw}px">${hh}</div>
        <div style="position:relative">
          <div class="gtvline" style="left:${tl}px"></div>
          <div class="gtflag" style="left:${tl-14}px">TODAY</div>
          ${rh}
        </div>
      </div>
    </div>
  </div>`;

  const tip = document.getElementById('gtip');
  if(tip){
    gc.querySelectorAll('[data-tip]').forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        const p = el.dataset.tip.split('|');
        tip.innerHTML = `<strong>${p[0]}</strong>📅 ${p[1]}<br>상태: ${p[2]}<br>담당: ${p[3]}`;
        tip.style.display = 'block';
      });
      el.addEventListener('mousemove', e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px'; });
      el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
    });
    gc.querySelectorAll('[data-issue]').forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        const p = el.dataset.issue.split('|');
        tip.innerHTML = `<strong>⚠️ 이슈 · ${p[1]}</strong>📅 ${p[0]}<br>${p[2]}`;
        tip.style.display = 'block';
      });
      el.addEventListener('mousemove', e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px'; });
      el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
      el.addEventListener('click', e=>{ e.stopPropagation(); });
    });
    gc.querySelectorAll('[data-memo]').forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        const p = el.dataset.memo.split('|');
        tip.innerHTML = `<strong>📝 메모 · ${p[0]}</strong>${p[1]}`;
        tip.style.display = 'block';
      });
      el.addEventListener('mousemove', e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px'; });
      el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
      el.addEventListener('click', e=>{ e.stopPropagation(); });
    });
  }
  const cv = document.getElementById('gcv');
  if(cv && tl>0) setTimeout(()=>{ cv.scrollLeft = tl - cv.offsetWidth*0.38; },60);
}

function setGZ(z){
  gZoom = z;
  ['week','month','quarter'].forEach(zz=>{
    const b = document.getElementById('gz-'+zz);
    if(b) b.classList.toggle('on', zz===z);
  });
  drawGantt(selId);
}
function toggleWeekend(){
  hideWeekend = !hideWeekend;
  const b = document.getElementById('gz-wknd');
  if(b) b.classList.toggle('on', hideWeekend);
  drawGantt(selId);
}
function gToday(){
  const cv = document.getElementById('gcv');
  const tl = document.querySelector('.gtvline');
  if(cv && tl) cv.scrollLeft = parseFloat(tl.style.left) - cv.offsetWidth*0.38;
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
